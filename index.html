<style>

.b-up{background:#ffcc33;color:#222}

.box{background:rgba(20,24,34,.8);padding:3px 7px;border-radius:7px;text-shadow:none}
.box .bar{height:4px;background:#444;border-radius:2px;margin-top:3px;overflow:hidden;min-width:70px}

.card{background:#1f2533;color:#fff;border-radius:16px;width:min(420px,92vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #333b4d;font-size:18px}
.mhead button{background:#333b4d;color:#fff;padding:6px 10px}
#mlist{overflow:auto;padding:8px 12px 14px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8b95a9;margin:12px 4px 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#283044;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row small{display:block;color:#aab3c5;font-weight:500;margin-top:2px;font-size:12px}
.row button{background:#ffcc33;color:#222;white-space:nowrap;box-shadow:none}
.row button.ad{background:#6c5ce7;color:#fff}
.row button.max{background:#444b5c;color:#aaa}
.reset{background:transparent;color:#ff8080;box-shadow:none;font-size:12px;margin:6px auto 0;display:block}
.b-look{background:#fff;color:#222}
#look{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#1f2533;color:#fff;border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.4);max-height:52vh;overflow:auto}
#look h3{margin:2px 0 8px;font-size:17px;text-align:center}
#look .lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8b95a9;margin:10px 2px 6px}
#look .sw{display:flex;flex-wrap:wrap;gap:8px}
#look .sw button{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent;box-shadow:none}
#look .sw button.on{border-color:#ffcc33;transform:scale(1.1)}
#look .opt{display:flex;gap:8px}
#look .opt button{flex:1;background:#283044;color:#fff;box-shadow:none;padding:10px 6px}
#look .opt button.on{background:#ffcc33;color:#222}
#look .done{width:100%;margin-top:14px;background:#3ddc84;color:#102;font-size:16px;padding:12px}
#testbox{position:fixed;left:10px;bottom:84px;z-index:6;display:flex;flex-direction:column;gap:6px;background:rgba(200,30,60,.9);color:#fff;padding:8px;border-radius:12px;font-size:11px;text-align:center}
#testbox button{background:#fff;color:#c81e3c;padding:8px 10px;font-size:13px}
#zoom{position:fixed;right:10px;bottom:84px;display:flex;flex-direction:column;gap:8px;z-index:5}

.b-mis{background:#3ddc84;color:#102}
.b-city{background:#fff;color:#222}
.badge{position:relative}.badge::after{content:'';position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#ff3b5c;border:2px solid #fff}
#pop{font-size:12px;margin-top:4px;padding:5px 10px;color:#fff;pointer-events:auto;cursor:pointer}#pop small{color:#aab3c5;font-weight:600}
#mini{display:flex;gap:6px;margin-top:6px}#mini button{width:38px;height:38px;padding:0;border-radius:50%;background:rgba(20,24,34,.85);color:#fff;font-size:18px}
.pbar{height:6px;background:#3a4256;border-radius:3px;margin-top:6px;overflow:hidden}.pbar i{display:block;height:100%;background:#3ddc84}
#offline{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:11;display:flex;align-items:center;justify-content:center}
#offline .adbox{display:flex;flex-direction:column;gap:10px}#offline .ofVal{font-size:30px;color:#2d8f5a;display:block;margin:8px 0}
.b-plain{background:#eef0f4;color:#333}

.adbox small{display:block;color:#888;letter-spacing:.12em;font-weight:800;margin-bottom:10px}
.adbox b{display:block;font-size:18px;margin-bottom:14px}
#adCount{font-size:40px;font-weight:900;color:#6c5ce7}
</style>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

// ---------- Dados ----------
const PRODUCTS = [
  {name:'Água',        color:0x4fa3ff, cost:1, price:3,  unlock:0,    brands:['AquaBem','Cristalina','Nascente Pura']},
  {name:'Salgadinhos', color:0xffa53a, cost:2, price:5,  unlock:40,   brands:['Crocks','Snacko','Golden Chips']},
  {name:'Refrigerante',color:0xe84a4a, cost:3, price:7,  unlock:120,  brands:['Bolha','Fizz Up','Royal Cola']},
  {name:'Frutas',      color:0x5cc25c, cost:3, price:8,  unlock:350,  brands:['Pomar','Fruta Boa','Orgânica Sol']},
  {name:'Laticínios',  color:0xf5ecd0, cost:4, price:10, unlock:600,  brands:['Vaquinha','Leite Serra','Alpes Gold']},
  {name:'Limpeza',     color:0xb07ae0, cost:5, price:13, unlock:1000, brands:['Limpinho','Brilho+','Ultra Pro']},
  {name:'Pães',        color:0xd9a35b, cost:5, price:14, unlock:1800, brands:['Forno Bom','Trigo de Ouro','Artesanal']},
  {name:'Congelados',  color:0x8fd3f0, cost:7, price:18, unlock:2500, brands:['Gelinho','Polar','Ártico Gourmet']},
  {name:'Higiene',     color:0xf29ac0, cost:8, price:21, unlock:3200, brands:['Suave','Perfumê','Spa Luxe']},
  {name:'Café',        color:0x8a5533, cost:9, price:25, unlock:4000, brands:['Cafezinho','Grão Nobre','Especial']},
];
const TP=100,SNACK=101; // tipos especiais carregados: papel higiênico e lanche
const TP_COST=1,SNACK_COST=2,SNACK_PRICE=9,TP_CAP=4,COUNTER_CAP=8,GRILL_CAP=6;
const BRAND_PRICE=[1,1.8,3.0], BRAND_COST=[1,1.25,1.5];
const SHELF_CAP=[8,12,16];
const CARRY_CAP=[4,6,8,10,12], CARRY_COST=[40,100,220,450];
const SPEED=[1,1.15,1.3,1.45], SPEED_COST=[60,150,350];
const V=(x,z)=>new THREE.Vector3(x,0,z);

// ---------- Rede de lojas (estado global) ----------
// Cada filial tem seu próprio progresso; dinheiro, visual, missões e configurações são globais.
const THEMES={
  bairro:{name:'Bairro',full:'SuperMKT Bairro',accent:0x2d8f5a,food:'lanchonete',price:1,cost:1,pads:1,open:0},
  praia:{name:'Praia',full:'SuperMKT Praia',accent:0x23a9b8,food:'sorveteria',price:1.7,cost:1.5,pads:1.6,open:60000},
  centro:{name:'Centro',full:'SuperMKT Centro',accent:0xb5413c,food:'acougue',price:2.8,cost:2.4,pads:2.6,open:220000},
  shopping:{name:'Shopping',full:'SuperMKT Shopping',accent:0x6c5ce7,food:'cafeteria',price:4.5,cost:3.8,pads:4.2,open:650000},
};
const THEME_ORDER=['bairro','praia','centro','shopping'];
const GKEY='supermkt-global';
const G={v:1,current:0,stores:['bairro'],money:null,look:null,lastSeen:0,rates:[0,0,0,0],missions:null,music:true,pop:[60,60,60,60]};
try{const d=JSON.parse(localStorage.getItem(GKEY));if(d&&d.v===1)Object.assign(G,d);}catch(e){}
const LAST_SEEN=G.lastSeen;
const STORE_IDX=Math.min(G.current,G.stores.length-1),THEME_ID=G.stores[STORE_IDX],STORE=THEMES[THEME_ID];
const PRESTIGE=1+0.25*(G.stores.length-1);   // bônus permanente: +25% nas vendas por filial aberta
const storeKey=i=>i===0?'mercado-tycoon-v2':'supermkt-store-'+i;

// ---------- Estado da loja atual ----------
const KEY=storeKey(STORE_IDX);
const S={v:2,look:null,money:20,unlocked:[true,false,false,false,false,false,false,false,false,false],
  carryLvl:0,speedLvl:0,brand:Array(10).fill(0),shelfLvl:Array(10).fill(0),stock:[4,0,0,0,0,0,0,0,0,0],padPaid:{},
  tp:[TP_CAP,TP_CAP,TP_CAP],dirty:[false,false,false],counter:0,grill:0,tables:[false,false,false,false]};
try{const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.v===2) Object.assign(S,d);
  else{const o=JSON.parse(localStorage.getItem('mercado-tycoon-v1'));if(o&&o.look)S.look=o.look;}}catch(e){}
if(G.money==null)G.money=S.money;else S.money=G.money;     // dinheiro é da rede toda
if(G.look==null)G.look=S.look;else S.look=G.look;
function saveG(){G.money=S.money;G.look=S.look;G.lastSeen=Date.now();try{localStorage.setItem(GKEY,JSON.stringify(G));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}saveG();}
const price=i=>Math.round(PRODUCTS[i].price*BRAND_PRICE[S.brand[i]]*STORE.price*PRESTIGE);
const cost=i=>Math.round(PRODUCTS[i].cost*BRAND_COST[S.brand[i]]*STORE.cost);
const cap=i=>SHELF_CAP[S.shelfLvl[i]];
const unlockedList=()=>PRODUCTS.map((_,i)=>i).filter(i=>S.unlocked[i]);
const padCost=id=>Math.round((PAD_COST[id]||1e9)*STORE.pads/10)*10;
const has=id=>(S.padPaid[id]||0)>=padCost(id);
let boostUntil=0;
const boost=()=>performance.now()<boostUntil?2:1;

// ---------- Planta da loja ----------
// frente (rua) em z=+5; a loja cresce para o leste (x) e para os fundos (z negativo)
const EAST=()=>has('east'), BACK=()=>has('back');
const bounds=()=>({minX:-8,maxX:EAST()?14:4,minZ:BACK()?-24.6:-12.6,maxZ:5});
const stockBack=()=>bounds().minZ, stockWallZ=()=>stockBack()+3.3;
const stockDoors=()=>BACK()?[1.8,6.3]:(EAST()?[0.5,8.4]:[0.5]);
// prateleiras em corredores: fileira A (z=-3.4) e B (z=-7.0)
const SLOTS=[
  {x:-5.4,z:-3.4},{x:-1.4,z:-3.4},{x:2.4,z:-3.4},
  {x:-5.4,z:-7.0},{x:-1.4,z:-7.0},{x:2.4,z:-7.0},
  {x:6.6,z:-3.4},{x:10.6,z:-3.4},{x:6.6,z:-7.0},{x:10.6,z:-7.0},
];
const PALLET_X=[-7.2,-5.7,-4.2,-2.7,-1.2,0.3,4.8,6.3,7.8,9.3], TP_PALLET_X=10.8;
const palletZ=()=>stockBack()+1.0;
const custPoint=i=>V(SLOTS[i].x,SLOTS[i].z+1.1);
const stockPoints=i=>[V(SLOTS[i].x,SLOTS[i].z-1.1),custPoint(i)];
const palletPoint=x=>V(x,palletZ()+1.05);
// caixas: balcão em z=2.3, operador do lado da rua (z=3.5), fila para dentro da loja
const REGS=[{x:-5.4},{x:-2.6},{x:7.0},{x:10.6}];
const REG_Z=2.3, regSpot=r=>V(REGS[r].x,3.5), queueSlot=(r,k)=>V(REGS[r].x,1.2-0.85*k);
const regOpen=r=>r===0||has('reg'+r);
const regStaff=r=>has('cash'+r);
// banheiros (depois da ampliação para os fundos)
const BATH={x0:8.5,x1:14,z0:-21.3,z1:-15.0,door:[10.6,12.0]};
const STALLS=[9.35,11.05,12.9].map(x=>({x,toilet:V(x,-20.7),spot:V(x,-19.9),dirt:V(x,-19.3)}));
const BATH_DOOR=V(11.3,-14.3);
// lanchonete
const GRILL={x:-7.45,z:-13.5,w:0.9,d:2.4}, SCOUNTER={x:-5.6,z:-13.5,w:0.9,d:3.0};
const COOK_SPOT=V(-6.5,-13.5), SNACK_SPOTS=[V(-4.6,-12.5),V(-4.6,-13.5),V(-4.6,-14.5)];
const TABLES=[V(-6.4,-17.6),V(-3.4,-17.6),V(-6.4,-20.2),V(-3.4,-20.2)];
const seatOf=t=>V(TABLES[t].x-0.8,TABLES[t].z);
// custo de cada área de compra (quadrados verdes)
const PAD_COST={p1:40,p2:120,p3:350,p4:600,p5:1000,p6:1800,p7:2500,p8:3200,p9:4000,
  cash0:200,stk1:350,reg1:800,cash1:600,stk2:900,east:1500,reg2:1500,cash2:1000,reg3:2500,cash3:1500,stk3:2000,
  back:5000,bath:3000,cleaner:1500,snack:6000,attendant:2000,waiter:2000};
// ---------- Estação do ano (calendário do hemisfério norte) ----------
// endereço com #teste ativa o modo de teste; pode combinar com a estação: #teste-inverno
const HASH=decodeURIComponent(location.hash.slice(1)).toLowerCase().split(/[-,]/);
const TEST_MODE=HASH.includes('teste');
function getSeason(){
  const map={primavera:'spring',verao:'summer','verão':'summer',outono:'autumn',inverno:'winter'};
  for(const h of HASH)if(map[h])return map[h];
  const d=new Date(),v=(d.getMonth()+1)*100+d.getDate();
  if(v>=1221||v<320)return'winter';if(v<621)return'spring';if(v<922)return'summer';return'autumn';
}
const SEASON=getSeason();
const TREE_SUFFIX={spring:'',summer:'',autumn:'Autumn_',winter:'Snow_'}[SEASON];
const TREES=THEME_ID==='praia'?['PalmTree_1','PalmTree_2','PalmTree_3','PalmTree_1','PalmTree_3']:['CommonTree_1','CommonTree_2','CommonTree_3','PineTree_1','PineTree_2'].map(n=>n.replace('_',`_${TREE_SUFFIX}`));
const BUSHES=SEASON==='winter'?['Bush_Snow_1','Bush_Snow_2']:SEASON==='summer'?['BushBerries_1','Bush_2']:['Bush_1','Bush_2'];
const BUILDINGS_A=['2Story_Mat','2Story_Balcony_Mat','3Story_Balcony_Mat','2Story_Sign_Mat','4Story_Mat','2Story_Columns_Mat','3Story_Slim_Mat','1Story_Sign_Mat','2Story_Wide_Mat','4Story_Center_Mat'];
const BUILDINGS_B=['Building3_Small','Building2_Small','Building4','Building3_Big'];
const CARS=['NormalCar1','NormalCar2','SUV','Taxi','SportsCar','SportsCar2','Cop'];
const ENV_FILES=[...new Set([...TREES,...BUSHES,...(SEASON==='spring'||SEASON==='summer'?['Flowers']:[]),...BUILDINGS_A,...BUILDINGS_B,...CARS,'Streetlight_Single'])];
// ---------- Three ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x2b3345);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,500);
scene.add(new THREE.HemisphereLight(0xffffff,0x556070,1.7));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(8,16,10); sun.target.position.set(2,0,0);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,far:60});
scene.add(sun,sun.target);
const matCache={};
const mat=c=>matCache[c]||(matCache[c]=new THREE.MeshLambertMaterial({color:c}));
const rgCache={};

function makePerson(kind,tints={},moveAnim='Walk'){
  const M=MODELS[kind];
  tints=Object.assign({Skin:SKIN_TONES[Math.floor(Math.random()*SKIN_TONES.length)],Face:0x2b1d16},tints);
  const g=new THREE.Group();
  const m=SkeletonUtils.clone(M.scene);m.scale.setScalar(M.scale);
  m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    const nm=mats.map(mt=>tints[mt.name]!=null?mt.clone():mt);
    nm.forEach(mt=>{if(tints[mt.name]!=null){mt.color=new THREE.Color(tints[mt.name]);}});
    o.material=Array.isArray(o.material)?nm:nm[0];}});
  g.add(m);
  const mixer=new THREE.AnimationMixer(m),actions={};
  for(const c of (M.anims.length?M.anims:MODELS.worker_m.anims))actions[c.name]=mixer.clipAction(c);
  g.userData={mixer,actions,cur:null,moving:false,moveAnim};

}
function playAnim(g,name){const a=g.userData;if(a.cur===name||!a.actions[name])return;

function step(o,target,speed,dt){
  const dx=target.x-o.pos.x,dz=target.z-o.pos.z,d=Math.hypot(dx,dz);
  if(d<0.02)return true;
  const s=Math.min(d,speed*dt);o.pos.x+=dx/d*s;o.pos.z+=dz/d*s;
  o.mesh.rotation.y=Math.atan2(dx,dz);o.walkT=(o.walkT||0)+dt*10;
  return s>=d-1e-4;
}

const CELL=0.4;let grid=null;
function rebuildNav(){
  rebuildObstacles();
  const b=bounds(),nx=Math.ceil((b.maxX-b.minX)/CELL),nz=Math.ceil((b.maxZ-b.minZ)/CELL),R=0.32;
  const free=new Uint8Array(nx*nz);
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){
    const x=b.minX+(i+0.5)*CELL,z=b.minZ+(j+0.5)*CELL;let ok=x>b.minX+0.35&&x<b.maxX-0.35&&z>b.minZ+0.35&&z<b.maxZ-0.2;
    if(ok)for(const o of obstacles){if(x>o.minX-R&&x<o.maxX+R&&z>o.minZ-R&&z<o.maxZ+R){ok=false;break;}}
    free[j*nx+i]=ok?1:0;}
  grid={b,nx,nz,free};
  for(const a of agents())if(a.target)a.path=navPath(a.pos,a.target);
}
const cellOf=p=>[Math.floor((p.x-grid.b.minX)/CELL),Math.floor((p.z-grid.b.minZ)/CELL)];
const cellPos=(i,j)=>V(grid.b.minX+(i+0.5)*CELL,grid.b.minZ+(j+0.5)*CELL);
const isFree=(i,j)=>i>=0&&j>=0&&i<grid.nx&&j<grid.nz&&grid.free[j*grid.nx+i];
function nearestFree(i,j){if(isFree(i,j))return[i,j];for(let r=1;r<12;r++)for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;if(isFree(i+di,j+dj))return[i+di,j+dj];}return[i,j];}
function lineFree(a,b){const d=a.distanceTo(b),n=Math.ceil(d/(CELL*0.5));for(let k=1;k<n;k++){const p=a.clone().lerp(b,k/n);const [i,j]=cellOf(p);if(!isFree(i,j))return false;}return true;}
function findPath(from,to){
  const [si,sj]=nearestFree(...cellOf(from)),[ti,tj]=nearestFree(...cellOf(to));
  const nx=grid.nx,N=nx*grid.nz,g=new Float32Array(N).fill(1e9),came=new Int32Array(N).fill(-1),closed=new Uint8Array(N);
  const s=sj*nx+si,t=tj*nx+ti;g[s]=0;const open=[[Math.hypot(ti-si,tj-sj),s]];
  const push=(f,n)=>{open.push([f,n]);let k=open.length-1;while(k>0){const p=(k-1)>>1;if(open[p][0]<=open[k][0])break;[open[p],open[k]]=[open[k],open[p]];k=p;}};
  const pop=()=>{const top=open[0],last=open.pop();if(open.length){open[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<open.length&&open[l][0]<open[m][0])m=l;if(r<open.length&&open[r][0]<open[m][0])m=r;if(m===k)break;[open[m],open[k]]=[open[k],open[m]];k=m;}}return top;};
  let found=false;
  while(open.length){const [,c]=pop();if(closed[c])continue;closed[c]=1;if(c===t){found=true;break;}
    const ci=c%nx,cj=(c-ci)/nx;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;const ni=ci+di,nj=cj+dj;if(!isFree(ni,nj))continue;
      if(di&&dj&&(!isFree(ci+di,cj)||!isFree(ci,cj+dj)))continue;const n=nj*nx+ni;const ng=g[c]+(di&&dj?1.414:1);
      if(ng<g[n]){g[n]=ng;came[n]=c;push(ng+Math.hypot(ti-ni,tj-nj),n);}}}
  if(!found)return[to.clone()];
  const cells=[];for(let c=t;c!==-1;c=came[c])cells.push(c);cells.reverse();
  const pts=cells.map(c=>cellPos(c%nx,(c-c%nx)/nx));pts[pts.length-1]=to.clone();
  // encurta o caminho onde há linha de visão
  const out=[];let a=from.clone();let k=0;
  while(k<pts.length){let far=k;for(let m=pts.length-1;m>k;m--){if(lineFree(a,pts[m])){far=m;break;}}out.push(pts[far]);a=pts[far];k=far+1;}
  return out;
}
const DOOR_IN=V(0,4.3);
function navPath(from,to){
  const out=[];let f=from;
  if(from.z>4.9){if(Math.abs(from.x)>0.6)out.push(V(0,6.6));out.push(DOOR_IN.clone());f=DOOR_IN;}
  if(to.z>4.9){out.push(...findPath(f,DOOR_IN),V(0,6.6),to.clone());return out;}
  out.push(...findPath(f,to));return out;
}
function goTo(a,target){a.target=target.clone();a.path=navPath(a.pos,a.target);}
function walk(a,speed,dt){if(!a.path||!a.path.length)return true;if(step(a,a.path[0],speed,dt))a.path.shift();return !a.path.length;}
function collide(p,r){
  for(const o of obstacles){
    const cx=Math.max(o.minX,Math.min(p.x,o.maxX)),cz=Math.max(o.minZ,Math.min(p.z,o.maxZ));

}

const reserved=new Map(); // alvo -> funcionário
function reserve(key,a){if(reserved.has(key)&&reserved.get(key)!==a)return false;reserved.set(key,a);return true;}
function release(a){for(const [k,v] of reserved)if(v===a)reserved.delete(k);}
function updateStaff(dt){
  for(const a of staff){
    if(a.role==='cashier'){syncMesh(a);continue;}
    if(a.path&&a.path.length){if(a.tool)a.tool.visible=false;walk(a,2.8,dt);syncMesh(a);if(a.stack)showStack(a.stack,a.carry,a.type);continue;}
    a.t+=dt;
    ({stocker:stockerAI,cleaner:cleanerAI,attendant:attendantAI,waiter:waiterAI})[a.role](a,dt);
    if(a.tool){a.tool.visible=false;
      if(a.state==='clean'&&!a.path.length){const kind=a.role==='cleaner'?'stall':'table',tgt=kind==='stall'?STALLS[a.job].dirt:TABLES[a.job];
        dirtProg[kind+a.job]=a.t/(kind==='stall'?1.6:1.2);cleanAnim(a,a.tool,kind,tgt,0,dt);}}
    syncMesh(a);if(a.stack)showStack(a.stack,a.carry,a.type);
  }
}
function stockerAI(a){
  if(a.state==='idle'&&a.t>0.4){a.t=0;
    let best=-1,br=0.7;
    for(const i of unlockedList()){const r=S.stock[i]/cap(i);if(r<br&&(a.carry===0||a.type===i)&&(!reserved.has('shelf'+i)||reserved.get('shelf'+i)===a)){br=r;best=i;}}
    if(best>=0){reserve('shelf'+best,a);a.type=best;
      if(a.carry>0){goTo(a,stockPoints(best)[0]);a.state='drop';}else{goTo(a,palletPoint(PALLET_X[best]));a.state='pick';}}
    else{release(a);const home=V(0.5+staff.indexOf(a)%3*1.2,palletZ()+2.2);if(a.pos.distanceTo(home)>0.4)goTo(a,home);}
  }else if(a.state==='pick'&&a.t>0.2){a.t=0;const i=a.type,need=cap(i)-S.stock[i];
    if(a.carry<6&&a.carry<need&&S.money>=cost(i)){a.carry++;S.money-=cost(i);}
    else if(a.carry>0){goTo(a,stockPoints(i)[0]);a.state='drop';}else{a.state='idle';release(a);}
  }else if(a.state==='drop'&&a.t>0.15){a.t=0;const i=a.type;
    if(a.carry>0&&S.stock[i]<cap(i)){S.stock[i]++;a.carry--;updateShelf(i);}
    else{if(!a.carry)a.type=-1;a.state='idle';release(a);}
  }
}

function isBought(p){return(S.padPaid[p.id]||0)>=p.cost;}
function updatePads(dt){
  for(const p of PADS){
    if(isBought(p)){if(p.mesh){scene.remove(p.mesh);removeLabel(p.L);p.mesh=null;}continue;}
    if(!p.cond())continue;
    // pads que dividem o lugar: só um por vez
    if(PADS.some(q=>q!==p&&q.mesh&&q.x===p.x&&q.z===p.z))continue;
    if(!p.mesh){

      const ed=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(p.w,p.d)),new THREE.LineBasicMaterial({color:0x3ddc84}));ed.rotation.x=-Math.PI/2;p.mesh.add(ed);

      p.L=addLabel('box pad',()=>V(p.x,p.z).setY(0.3));

    let paid=S.padPaid[p.id]||0;
    const on=Math.abs(player.pos.x-p.x)<p.w/2&&Math.abs(player.pos.z-p.z)<p.d/2;
    p.stand=on?(p.stand||0)+dt:0;

      paid+=amt;S.money-=amt;S.padPaid[p.id]=paid;
      if(paid>=p.cost-1e-6){S.padPaid[p.id]=p.cost;scene.remove(p.mesh);removeLabel(p.L);p.mesh=null;p.buy();save();continue;}
    }
    const left=Math.ceil(p.cost-paid);
    setLabel(p.L,`<img class="ic" src="assets/lock.png">${p.name}<br>$${left}<div class="bar"><i style="width:${paid/p.cost*100}%"></i></div>`);

}

function playerActions(dt){
  const p=player.pos;

  // limpeza: ficar parado perto de sujeira
  let cleaning=null;

  if(!player.mop){player.mop=attachMop(player.mesh);player.cloth=makeCloth();}
  player.mop.visible=false;player.cloth.visible=false;
  if(cleaning){player.cleanT+=dt;dirtProg[cleaning.kind+cleaning.k]=player.cleanT/1.2;
    cleanAnim(player,cleaning.kind==='stall'?player.mop:player.cloth,cleaning.kind,cleaning.pos,player.cleanT/1.2,dt);if(!player.cleanL)player.cleanL=addLabel('box',()=>player.pos.clone().setY(2.1));

    if(player.cleanT>=1.2){if(cleaning.kind==='stall'){S.dirty[cleaning.k]=false;updateStall(cleaning.k);}else{S.tables[cleaning.k]=false;updateSnack();}player.cleanT=0;floatText(p,'Limpo! ✨','#9be7ff');missionHit('clean');popAdd(0.5);}}
  else{player.cleanT=0;if(player.cleanL){removeLabel(player.cleanL);player.cleanL=null;}}
  player.actT+=dt;if(player.actT<0.12)return;
  let acted=false;const t=player.type;
  if(player.carry>0&&t>=0&&t<TP&&nearShelf(p,t)&&S.stock[t]<cap(t)){S.stock[t]++;dropOne();updateShelf(t);missionHit('restock');acted=true;}
  else if(player.carry>0&&t===TP){const k=STALLS.findIndex((s,j)=>stallObjs[j]&&S.tp[j]<TP_CAP&&p.distanceTo(s.spot)<1.1);if(k>=0){S.tp[k]++;dropOne();updateStall(k);acted=true;}}
  else if(player.carry>0&&t===SNACK&&nearBox(p,SCOUNTER.x,SCOUNTER.z,SCOUNTER.w/2,SCOUNTER.d/2,0.8)&&S.counter<COUNTER_CAP){S.counter++;dropOne();updateSnack();acted=true;}
  if(!acted){
    // pegar no pallet / chapa
    for(const i of unlockedList()){
      if(!nearPalletX(p,PALLET_X[i]))continue;
      if(player.carry>0&&t!==i){if(t<TP)S.money+=cost(t);else if(t===TP)S.money+=TP_COST;dropOne();acted=true;}
      else if(player.carry<carryCap()&&S.money>=cost(i)){player.carry++;player.type=i;S.money-=cost(i);acted=true;}
      else if(S.money<cost(i)&&player.carry===0&&!player.noMoneyT){floatText(p,'Sem dinheiro','#ff6b6b');player.noMoneyT=2;}
      break;
    }
    if(!acted&&tpPallet&&nearPalletX(p,TP_PALLET_X)){
      if(player.carry>0&&t!==TP){if(t<TP)S.money+=cost(t);dropOne();acted=true;}
      else if(player.carry<carryCap()&&S.money>=TP_COST){player.carry++;player.type=TP;S.money-=TP_COST;acted=true;}
    }
    if(!acted&&snackObjs&&nearBox(p,GRILL.x,GRILL.z,GRILL.w/2,GRILL.d/2,0.8)&&S.grill>0&&(player.carry===0||t===SNACK)&&player.carry<carryCap()){
      S.grill--;player.carry++;player.type=SNACK;updateSnack();acted=true;}
  }
  if(acted)player.actT=0;
}

function nextTask(c){

  else if(kind==='bath'){goTo(c,BATH_DOOR);c.state='toBath';}
  else if(kind==='pay'){if(!c.items.length){nextTask(c);return;}
    let best=0,bl=1e9;REGS.forEach((r,k)=>{if(!regOpen(k))return;const l=queues[k].length+(regStaff(k)?0:0.5)+Math.abs(c.pos.x-r.x)*0.05;if(l<bl){bl=l;best=k;}});
    c.reg=best;queues[best].push(c);goTo(c,queueSlot(best,Math.min(queues[best].length-1,4)));c.state='queue';}
  else if(kind==='snack'){c.state='toSnack';const k=SNACK_SPOTS.findIndex((s,j)=>reserve('sspot'+j,c));
    if(k<0){goTo(c,V(-3.4,-12.0+Math.random()*-1.5));c.spot=-1;}else{c.spot=k;goTo(c,SNACK_SPOTS[k]);}}

}

function updateCustomers(dt){

        else{bubble=c.t>3?'😠':'❗';if(c.t>6){angry(c);nextTask(c);}}break;}
      case 'toBath':if(arrived){c.state='bathWait';c.t=0;}break;

      case 'leaveBath':if(arrived)nextTask(c);break;

          const rate=atReg?1/time:(regStaff(c.reg)?0.65/time:0);c.t+=dt*rate;
          bubble=rate?`💳 ${Math.round(Math.min(c.t,1)*100)}%`:'⏳';
          if(c.t>=1){const total=c.items.reduce((a,b)=>a+b,0)*boost();S.money+=total;floatText(V(REGS[c.reg].x,REG_Z),'+$'+total);income(total);missionHit('serve');if(!c.angry)popAdd(0.7);
            q.shift();c.items=[];nextTask(c);}}
        break;}
      case 'toSnack':if(arrived){if(c.spot<0){const k=SNACK_SPOTS.findIndex((s,j)=>reserve('sspot'+j,c));if(k>=0){c.spot=k;goTo(c,SNACK_SPOTS[k]);}else{c.t+=0.5;if(c.t>8){angry(c);nextTask(c);}}}else{c.state='buySnack';c.t=0;}}break;
      case 'buySnack':{c.t+=dt;c.mesh.rotation.y=-Math.PI/2;

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function getEvent(){
  for(const h of HASH)if(['natal','blackfriday','halloween','pascoa'].includes(h))return h;
  const d=new Date(),m=d.getMonth()+1,day=d.getDate();
  if(m===12&&day<=26)return'natal';
  if(m===11&&day>=20)return'blackfriday';
  if(m===10&&day>=24)return'halloween';
  const e=easter(d.getFullYear()),diff=(d-e)/864e5;if(diff>=-7&&diff<=1)return'pascoa';
  return null;
}

// ---------- Missões do dia ----------
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
const MISSIONS={
  serve:{txt:n=>`Atenda ${n} clientes no caixa`,base:15},
  items:{txt:n=>`Venda ${n} produtos`,base:45},
  restock:{txt:n=>`Reponha ${n} itens nas prateleiras`,base:35},
  earn:{txt:n=>`Fature $${n.toLocaleString('pt-BR')} em vendas`,base:600,money:true},
  clean:{txt:n=>`Limpe ${n} sujeiras`,base:5,need:()=>stallObjs.length||snackObjs},
  snack:{txt:n=>`Venda ${n} ${FOOD.item} ${FOOD.na}`,base:10,need:()=>snackObjs},
};
function ensureMissions(){
  if(G.missions&&G.missions.day===todayKey()&&G.missions.store===STORE_IDX)return;
  let seed=[...todayKey()].reduce((a,c)=>a*31+c.charCodeAt(0),7)+STORE_IDX;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const ids=Object.keys(MISSIONS).filter(k=>!MISSIONS[k].need||MISSIONS[k].need()).sort(()=>rnd()-0.5).slice(0,3);
  const scale=1+STORE_IDX*0.8;
  G.missions={day:todayKey(),store:STORE_IDX,list:ids.map((id,k)=>{const M=MISSIONS[id];const n=Math.round(M.base*scale*(M.money?STORE.price:1)*(1+k*0.35));
    return{id,n,p:0,done:false,reward:Math.round((120+n*(M.money?0.35:12))*(1+STORE_IDX)/10)*10};})};
  saveG();
}
function missionHit(id,amt=1){if(!G.missions)return;for(const m of G.missions.list)if(m.id===id&&!m.done){m.p=Math.min(m.n,m.p+amt);}drawMissionBadge();}
const btnMis=document.getElementById('btnMis');
function drawMissionBadge(){const ready=G.missions&&G.missions.list.some(m=>!m.done&&m.p>=m.n);btnMis.classList.toggle('badge',!!ready);}
function renderMissions(){
  mlist.innerHTML='';sec('Hoje');
  for(const m of G.missions.list){const M=MISSIONS[m.id],pct=Math.round(m.p/m.n*100);
    const r=document.createElement('div');r.className='row';
    r.innerHTML=`<div style="flex:1"><b>${M.txt(m.n)}</b><small>${m.done?'✅ Concluída':`${Math.floor(m.p).toLocaleString('pt-BR')} / ${m.n.toLocaleString('pt-BR')}`} · prêmio $${m.reward.toLocaleString('pt-BR')}</small><div class="pbar"><i style="width:${pct}%"></i></div></div>`;
    const b=document.createElement('button');b.textContent=m.done?'OK':'Receber';
    if(!m.done&&m.p>=m.n)b.onclick=()=>{m.done=true;S.money+=m.reward;floatText(player.pos,'+$'+m.reward);save();renderMissions();drawMissionBadge();};else{b.disabled=true;b.className='max';}

// ---------- Lucro automático e offline ----------
let ema=0,secInc=0,incT=0;
function income(v){secInc+=v;missionHit('earn',v);}
function automation(){const open=REGS.filter((r,k)=>regOpen(k)).length,staffed=REGS.filter((r,k)=>regOpen(k)&&regStaff(k)).length;
  return(open?staffed/open:0)*(staff.some(a=>a.role==='stocker')?1:0.25);}
function updateIncome(dt){incT+=dt;if(incT<1)return;incT=0;
  ema=ema*0.985+secInc*0.015;secInc=0;G.rates[STORE_IDX]=ema*automation();
  // as outras filiais continuam vendendo enquanto você joga aqui
  const other=G.rates.reduce((a,r,i)=>a+(i!==STORE_IDX&&i<G.stores.length?r:0),0);if(other>0)S.money+=other;
  if(PADS.every(isBought)){G.done=G.done||[];if(!G.done[STORE_IDX]){G.done[STORE_IDX]=true;saveG();toast('Loja completa! Abra uma filial no mapa da cidade 🗺️');}}
}
const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}min`:`${m}min`;};
function checkOffline(){
  if(!LAST_SEEN)return;const el=(Date.now()-LAST_SEEN)/1000;if(el<120)return;
  const total=G.rates.reduce((a,r,i)=>a+(i<G.stores.length?r:0),0);
  const earned=Math.round(total*Math.min(el,8*3600)*0.5);if(earned<5)return;
  const box=document.getElementById('offline');box.classList.remove('hidden');
  box.querySelector('.ofTxt').innerHTML=`Enquanto você esteve fora (${fmtTime(Math.min(el,8*3600))}${el>8*3600?', máximo de 8h':''}), seus funcionários continuaram trabalhando.<br><b class="ofVal">+$${earned.toLocaleString('pt-BR')}</b>`;
  box.querySelector('#ofGet').onclick=()=>{S.money+=earned;box.classList.add('hidden');save();floatText(player.pos,'+$'+earned);};
  box.querySelector('#ofAd').onclick=()=>{box.classList.add('hidden');showAd(()=>{S.money+=earned*2;save();floatText(player.pos,'+$'+earned*2);toast('Lucro dobrado!');});};
}

  function styleFor(){

  function osc(type,f,t,dur,vol,a=0.005,dec=0.2,sus=0,out=master,detune=0){

    if(sus>0)g.gain.setTargetAtTime(0.0001,t+dur,0.06);
    o.connect(g);g.connect(out);o.start(t);o.stop(t+dur+(sus>0?0.5:dec+0.1));return o;}
  function lp(freq,q=0.7){const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;f.Q.value=q;f.connect(master);return f;}
  const INST={
    pluck:(t,m,d)=>{osc('triangle',mtof(m),t,d,0.24,0.004,0.28);osc('sine',mtof(m+12),t,d,0.04,0.003,0.12);},
    marimba:(t,m,d)=>{osc('sine',mtof(m),t,d,0.2,0.002,0.4);osc('sine',mtof(m)*4,t,d,0.05,0.001,0.07);},
    accordion:(t,m,d)=>{const f=lp(1700);const o1=osc('sawtooth',mtof(m),t,d*0.9,0.075,0.03,0.1,0.8,f,-7),o2=osc('sawtooth',mtof(m),t,d*0.9,0.075,0.03,0.1,0.8,f,7);
      const l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=5.5;lg.gain.value=6;l.connect(lg);lg.connect(o1.detune);lg.connect(o2.detune);l.start(t);l.stop(t+d+0.5);},
    epiano:(t,m,d)=>{osc('sine',mtof(m),t,d,0.12,0.005,0.9,0.15);osc('sine',mtof(m)*2.01,t,d,0.03,0.003,0.3);},
    celesta:(t,m,d)=>{osc('sine',mtof(m+12),t,d,0.12,0.002,0.8);osc('sine',mtof(m+12)*3,t,d,0.025,0.001,0.25);},
    saw:(t,m,d)=>{const f=lp(2400,2);osc('sawtooth',mtof(m),t,d,0.07,0.005,0.18,0.3,f);osc('square',mtof(m+12),t,d,0.02,0.005,0.1,0,f);},
    organ:(t,m,d)=>{const f=lp(1500);osc('square',mtof(m),t,d,0.04,0.02,0.1,0.8,f);osc('sine',mtof(m+12),t,d,0.05,0.02,0.1,0.8);},
    bass:(t,m,d)=>{const f=lp(500);osc('square',mtof(m-24),t,d,0.12,0.005,0.18,0.4,f);},
    softbass:(t,m,d)=>{osc('sine',mtof(m-24),t,d,0.22,0.01,0.3,0.4);},
    saw_bass:(t,m,d)=>{const f=lp(380,3);osc('sawtooth',mtof(m-24),t,d,0.16,0.005,0.15,0.3,f);},
  };
  function kick(t,v=0.5){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+0.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.25);o.connect(g);g.connect(master);o.start(t);o.stop(t+0.3);}
  function nz(t,type,freq,dur,v){const s=noise(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type=type;f.frequency.value=freq;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+0.02);}
  const hat=(t,v=0.05)=>nz(t,'highpass',8000,0.04,v), snare=(t,v=0.14)=>nz(t,'bandpass',1800,0.14,v), shaker=(t,v=0.035)=>nz(t,'highpass',6000,0.06,v);
  const rim=(t)=>{osc('triangle',1700,t,0.02,0.06,0.001,0.03);}, tri=(t)=>{osc('sine',2600,t,0.2,0.03,0.001,0.35);};
  const bells=(t)=>{for(let k=0;k<3;k++)nz(t+k*0.012,'bandpass',7000+k*600,0.08,0.03);};
  const DRUMS={
    pop:(s,t)=>{if(s%4===0)kick(t,0.45);if(s===4||s===12)snare(t);if(s%2===0)hat(t);},
    bossa:(s,t)=>{if(s===0||s===6||s===8||s===14)kick(t,0.25);if([0,3,6,10,12].includes(s))rim(t);shaker(t,s%2?0.02:0.035);},
    forro:(s,t)=>{if(s===0||s===6||s===8||s===14)kick(t,0.4);if(s===4||s===12)nz(t,'bandpass',900,0.1,0.1);tri(t);},
    lounge:(s,t)=>{if(s===0||s===10)kick(t,0.25);if(s===4||s===12)nz(t,'bandpass',2500,0.2,0.05);if(s%2===0)hat(t,0.025);},
    natal:(s,t)=>{if(s%4===0)kick(t,0.3);if(s===4||s===12)snare(t,0.08);bells(t);},
    party:(s,t)=>{if(s%4===0)kick(t,0.55);if(s%4===2)hat(t,0.09);if(s===4||s===12)nz(t,'bandpass',1500,0.12,0.12);if(s%2===1)hat(t,0.03);},
  };
  function rng(seed){return()=>((seed=(seed*16807)%2147483647)/2147483647);}
  function build(){
    const name=styleFor(),st=JSON.parse(JSON.stringify(STYLES[name]));
    // a estação mexe no clima da música (o evento já tem estilo próprio)
    if(!EVENT){if(SEASON==='summer')st.bpm+=6;if(SEASON==='winter'){st.bpm-=6;st.winter=true;}if(SEASON==='spring')st.octave=12;if(SEASON==='autumn'){st.bpm-=3;st.soft=true;}}
    const R=rng(1000+loops*97+name.length*13+(SEASON.length*7)),sc=SCALES[st.scale];
    const deg=(d,o=0)=>st.root+o+sc[((d%7)+7)%7]+12*Math.floor(d/7);
    const chords=st.prog.map(d=>[deg(d),deg(d+2),deg(d+4)].concat(st.sev?[deg(d+6)]:[]));
    // melodia: frase A (4 compassos) repetida com variação no fim
    const phrase=[];let cur=4;
    for(let bar=0;bar<4;bar++){const notes=[];for(const s of st.melody){if(R()<0.22)continue;
        cur+=Math.round((R()-0.5)*3);cur=Math.max(0,Math.min(9,cur));const tones=[0,2,4].map(x=>st.prog[bar]+x);
        const d=R()<0.6?tones.reduce((a,b)=>Math.abs(b%7-cur%7)<Math.abs(a%7-cur%7)?b:a):cur;notes.push([s,deg(d,12)+(st.octave||0),R()<0.3?2:1]);}
      phrase.push(notes);}
    const end=phrase[3].map(n=>[n[0],n[1]+(R()<0.5?2:-2),n[2]]);
    song={st,chords,mel:[...phrase,phrase[0],phrase[1],phrase[2],end],stepDur:60/st.bpm/4};
  }
  function schedule(s,t){
    const st=song.st,bar=Math.floor(s/16)%8,s16=s%16,ch=song.chords[bar%4];
    if(st.swing&&s16%2===1)t+=song.stepDur*st.swing;
    for(const [ss,m,len] of song.mel[bar])if(ss===s16)INST[st.lead](t,m,song.stepDur*2*len);
    // baixo
    if(st.drums==='bossa'){if(s16===0)INST[st.bass](t,ch[0],0.5);if(s16===6)INST[st.bass](t,ch[2]-12,0.3);if(s16===8)INST[st.bass](t,ch[2]-12,0.4);}
    else if(st.drums==='party'){if(s16%2===0)INST[st.bass](t,ch[0],0.12);}
    else if(st.drums==='forro'){if(s16===0||s16===8)INST[st.bass](t,ch[0],0.25);if(s16===6||s16===14)INST[st.bass](t,ch[2]-12,0.2);}
    else{if(s16===0)INST[st.bass](t,ch[0],0.45);if(s16===8)INST[st.bass](t,s%32<16?ch[0]:ch[2]-12,0.45);if(s16===14&&st.drums==='pop')INST[st.bass](t,ch[0]+12,0.12);}
    // acompanhamento
    if(st.comp==='stab'&&(s16===4||s16===12))ch.slice(0,3).forEach(m=>osc('triangle',mtof(m),t,0.12,0.035,0.004,0.12));
    if(st.comp==='epiano'&&(s16===0||s16===7||s16===10))ch.forEach(m=>INST.epiano(t,m-12,0.4));
    if(st.comp==='pad'&&s16===0){const f=lp(st.soft?700:1100);ch.forEach(m=>osc('sawtooth',mtof(m-12),t,song.stepDur*15,0.022,0.25,0.4,0.7,f));}
    DRUMS[st.drums](s16,t);
    if(st.winter&&s16%2===0)bells(t);
  }
  function tick(){while(next<ctx.currentTime+0.15){schedule(step,next);next+=song.stepDur;step++;
      if(step%128===0){loops++;if(loops%3===0)build();}}}
  function start(){if(ctx||G.music===false)return;
    ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=0.5;
    const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
    build();next=ctx.currentTime+0.1;timer=setInterval(tick,30);}
  function stop(){if(!ctx)return;clearInterval(timer);ctx.close();ctx=null;}
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else ctx.resume();});
  return{start,stop,get on(){return !!ctx}};
})();
const btnSnd=document.getElementById('btnSnd');
function drawSnd(){btnSnd.textContent=G.music===false?'🔇':'🔊';}
btnSnd.onclick=e=>{e.stopPropagation();G.music=G.music===false;if(G.music)Music.start();else Music.stop();drawSnd();saveG();};
const startAudio=()=>{if(G.music!==false)Music.start();};
addEventListener('pointerdown',startAudio,{once:true});addEventListener('keydown',startAudio,{once:true});

// ---------- Modo de teste ----------
function unlockAll(){
  for(let round=0;round<40;round++){let any=false;
    for(const p of PADS){if(isBought(p)||!p.cond())continue;S.padPaid[p.id]=p.cost;if(p.mesh){scene.remove(p.mesh);removeLabel(p.L);p.mesh=null;}p.buy();any=true;}
    if(!any)break;}
  save();toast('Tudo liberado!');
}
if(TEST_MODE){
  const box=document.createElement('div');box.id='testbox';
  box.innerHTML='<b>MODO TESTE</b><button id="tMoney">+$50.000</button><button id="tAll">Liberar tudo</button>';
  document.body.appendChild(box);
  document.getElementById('tMoney').onclick=()=>{S.money+=50000;save();toast('+$50.000');};
  document.getElementById('tAll').onclick=unlockAll;
}
ensureMissions();drawMissionBadge();drawSnd();drawPop();buildEventDecor();
const firstRun=!S.look;
if(firstRun)openLook();
updateCamera(0,true);
document.getElementById('loading').remove();
requestAnimationFrame(loop);
if(!firstRun)checkOffline();
if(EV)setTimeout(()=>toast(EV.info),1200);else if(STORE_IDX>0)setTimeout(()=>toast('Bem-vindo ao '+STORE.full+'!'),800);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.__game={Music,get pop(){return pop},S,player,customers,staff,queues,get grid(){return grid},relayout,rebuildNav,PADS,updateStall,updateSnack};
</script>
