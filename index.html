<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mercado Tycoon — protótipo</title>
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2b3345;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
.hidden{display:none!important}
#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;gap:8px}
.ic{width:20px;height:20px;vertical-align:-5px;margin-right:4px}
.lbl .ic{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
.row .ic{width:22px;height:22px;vertical-align:-6px;margin-right:6px}
.pill{background:rgba(20,24,34,.85);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#money{font-size:22px;color:#7CFC7C}
#lvl{font-size:12px;color:#cfd6e4;margin-top:4px;padding:5px 10px}
#boost{color:#ffcc33;font-size:14px;margin-left:6px}
#right{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
button{pointer-events:auto;border:0;border-radius:12px;padding:10px 14px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 2px 8px rgba(0,0,0,.3)}
button:disabled{opacity:.5;cursor:default}
.b-up{background:#ffcc33;color:#222}
.b-ad{background:#6c5ce7;color:#fff}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);color:#fff;font-weight:800;text-shadow:0 1px 3px #000,0 0 2px #000;white-space:nowrap;text-align:center;font-size:12px;will-change:transform}
.box{background:rgba(20,24,34,.8);padding:3px 7px;border-radius:7px;text-shadow:none}
.box .bar{height:4px;background:#444;border-radius:2px;margin-top:3px;overflow:hidden;min-width:70px}
.box .bar i{display:block;height:100%;background:#3ddc84}
.pad{border:2px solid #3ddc84}
.empty{color:#ff6b6b}
.float{font-size:17px;color:#7CFC7C}
.bubble{font-size:17px}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(20,24,34,.85);color:#fff;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:700;z-index:5;pointer-events:none;text-align:center;max-width:88vw}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#3ddc84;color:#102;padding:10px 16px;border-radius:12px;font-weight:800;z-index:6;pointer-events:none;transition:opacity .3s}
#joyBase,#joyKnob{position:fixed;border-radius:50%;pointer-events:none;z-index:4;transform:translate(-50%,-50%)}
#joyBase{width:110px;height:110px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.35)}
#joyKnob{width:50px;height:50px;background:rgba(255,255,255,.6)}
#modal,#ad{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:center;justify-content:center}
.card{background:#1f2533;color:#fff;border-radius:16px;width:min(420px,92vw);max-height:82vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #333b4d;font-size:18px}
.mhead button{background:#333b4d;color:#fff;padding:6px 10px}
#mlist{overflow:auto;padding:8px 12px 14px}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8b95a9;margin:12px 4px 6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#283044;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.row small{display:block;color:#aab3c5;font-weight:500;margin-top:2px;font-size:12px}
.row button{background:#ffcc33;color:#222;white-space:nowrap;box-shadow:none}
.row button.ad{background:#6c5ce7;color:#fff}
.row button.max{background:#444b5c;color:#aaa}
.reset{background:transparent;color:#ff8080;box-shadow:none;font-size:12px;margin:6px auto 0;display:block}
.b-look{background:#fff;color:#222}
#look{position:fixed;left:0;right:0;bottom:0;z-index:9;background:#1f2533;color:#fff;border-radius:18px 18px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.4);max-height:52vh;overflow:auto}
#look h3{margin:2px 0 8px;font-size:17px;text-align:center}
#look .lab{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8b95a9;margin:10px 2px 6px}
#look .sw{display:flex;flex-wrap:wrap;gap:8px}
#look .sw button{width:34px;height:34px;border-radius:50%;padding:0;border:3px solid transparent;box-shadow:none}
#look .sw button.on{border-color:#ffcc33;transform:scale(1.1)}
#look .opt{display:flex;gap:8px}
#look .opt button{flex:1;background:#283044;color:#fff;box-shadow:none;padding:10px 6px}
#look .opt button.on{background:#ffcc33;color:#222}
#look .done{width:100%;margin-top:14px;background:#3ddc84;color:#102;font-size:16px;padding:12px}
#testbox{position:fixed;left:10px;bottom:84px;z-index:6;display:flex;flex-direction:column;gap:6px;background:rgba(200,30,60,.9);color:#fff;padding:8px;border-radius:12px;font-size:11px;text-align:center}
#testbox button{background:#fff;color:#c81e3c;padding:8px 10px;font-size:13px}
#zoom{position:fixed;right:10px;bottom:84px;display:flex;flex-direction:column;gap:8px;z-index:5}
#zoom button{width:44px;height:44px;padding:0;border-radius:50%;background:rgba(20,24,34,.85);color:#fff;font-size:24px;line-height:1}
.adbox{background:#fff;color:#222;border-radius:16px;padding:28px 24px;text-align:center;width:min(340px,86vw)}
.adbox small{display:block;color:#888;letter-spacing:.12em;font-weight:800;margin-bottom:10px}
.adbox b{display:block;font-size:18px;margin-bottom:14px}
#adCount{font-size:40px;font-weight:900;color:#6c5ce7}
</style>
</head>
<body>
<div id="loading" style="position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#2b3345;color:#fff;font-weight:800;font-size:18px;flex-direction:column;gap:14px"><img src="assets/icon-192.png" width="120" height="120" alt="">Carregando…</div>
<div id="labels"></div>
<div id="hud">
  <div>
    <div class="pill"><img class="ic" src="assets/cash.png" alt=""><span id="money">$0</span><span id="boost"></span></div>
    <div class="pill" id="lvl">Loja nível 1</div>
  </div>
  <div id="right">
    <button class="b-up" id="btnUp"><img class="ic" src="assets/upgrade.png" alt="">Melhorias</button>
    <button class="b-ad" id="btnAd"><img class="ic" src="assets/ad.png" alt="">Dinheiro 2x</button>
    <button class="b-look" id="btnLook">👕 Visual</button>
  </div>
</div>
<div id="zoom"><button id="zIn" aria-label="Aproximar">+</button><button id="zOut" aria-label="Afastar">−</button></div>
<div id="hint"></div>
<div id="toast" style="opacity:0"></div>
<div id="joyBase" class="hidden"></div><div id="joyKnob" class="hidden"></div>
<div id="look" class="hidden"></div>
<div id="modal" class="hidden"><div class="card"><div class="mhead"><b>Melhorias</b><button id="closeM">✕</button></div><div id="mlist"></div></div></div>
<div id="ad" class="hidden"><div class="adbox"><small>ANÚNCIO (SIMULAÇÃO)</small><b>Aqui entra o vídeo da rede de anúncios</b><div id="adCount">3</div></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

// ---------- Dados ----------
const PRODUCTS = [
  {name:'Água',        color:0x4fa3ff, cost:1, price:3,  unlock:0,    brands:['AquaBem','Cristalina','Nascente Pura']},
  {name:'Salgadinhos', color:0xffa53a, cost:2, price:5,  unlock:40,   brands:['Crocks','Snacko','Golden Chips']},
  {name:'Refrigerante',color:0xe84a4a, cost:3, price:7,  unlock:120,  brands:['Bolha','Fizz Up','Royal Cola']},
  {name:'Frutas',      color:0x5cc25c, cost:3, price:8,  unlock:350,  brands:['Pomar','Fruta Boa','Orgânica Sol']},
  {name:'Laticínios',  color:0xf5ecd0, cost:4, price:10, unlock:600,  brands:['Vaquinha','Leite Serra','Alpes Gold']},
  {name:'Limpeza',     color:0xb07ae0, cost:5, price:13, unlock:1000, brands:['Limpinho','Brilho+','Ultra Pro']},
  {name:'Pães',        color:0xd9a35b, cost:5, price:14, unlock:1800, brands:['Forno Bom','Trigo de Ouro','Artesanal']},
  {name:'Congelados',  color:0x8fd3f0, cost:7, price:18, unlock:2500, brands:['Gelinho','Polar','Ártico Gourmet']},
  {name:'Higiene',     color:0xf29ac0, cost:8, price:21, unlock:3200, brands:['Suave','Perfumê','Spa Luxe']},
  {name:'Café',        color:0x8a5533, cost:9, price:25, unlock:4000, brands:['Cafezinho','Grão Nobre','Especial']},
];
const TP=100,SNACK=101; // tipos especiais carregados: papel higiênico e lanche
const TP_COST=1,SNACK_COST=2,SNACK_PRICE=9,TP_CAP=4,COUNTER_CAP=8,GRILL_CAP=6;
const BRAND_PRICE=[1,1.5,2.2], BRAND_COST=[1,1.3,1.7];
const SHELF_CAP=[8,12,16];
const CARRY_CAP=[4,6,8,10,12], CARRY_COST=[40,100,220,450];
const SPEED=[1,1.15,1.3,1.45], SPEED_COST=[60,150,350];
const V=(x,z)=>new THREE.Vector3(x,0,z);

// ---------- Estado ----------
const KEY='mercado-tycoon-v2';
const S={v:2,look:null,money:20,unlocked:[true,false,false,false,false,false,false,false,false,false],
  carryLvl:0,speedLvl:0,brand:Array(10).fill(0),shelfLvl:Array(10).fill(0),stock:[4,0,0,0,0,0,0,0,0,0],padPaid:{},
  tp:[TP_CAP,TP_CAP,TP_CAP],dirty:[false,false,false],counter:0,grill:0,tables:[false,false,false,false]};
try{const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.v===2) Object.assign(S,d);
  else{const o=JSON.parse(localStorage.getItem('mercado-tycoon-v1'));if(o&&o.look)S.look=o.look;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const price=i=>Math.round(PRODUCTS[i].price*BRAND_PRICE[S.brand[i]]);
const cost=i=>Math.round(PRODUCTS[i].cost*BRAND_COST[S.brand[i]]);
const cap=i=>SHELF_CAP[S.shelfLvl[i]];
const unlockedList=()=>PRODUCTS.map((_,i)=>i).filter(i=>S.unlocked[i]);
const has=id=>(S.padPaid[id]||0)>=(PAD_COST[id]||1e9);
let boostUntil=0;
const boost=()=>performance.now()<boostUntil?2:1;

// ---------- Planta da loja ----------
// frente (rua) em z=+5; a loja cresce para o leste (x) e para os fundos (z negativo)
const EAST=()=>has('east'), BACK=()=>has('back');
const bounds=()=>({minX:-8,maxX:EAST()?14:4,minZ:BACK()?-24.6:-12.6,maxZ:5});
const stockBack=()=>bounds().minZ, stockWallZ=()=>stockBack()+3.3;
const stockDoors=()=>BACK()?[1.8,6.3]:(EAST()?[0.5,8.4]:[0.5]);
// prateleiras em corredores: fileira A (z=-3.4) e B (z=-7.0)
const SLOTS=[
  {x:-5.4,z:-3.4},{x:-1.4,z:-3.4},{x:2.4,z:-3.4},
  {x:-5.4,z:-7.0},{x:-1.4,z:-7.0},{x:2.4,z:-7.0},
  {x:6.6,z:-3.4},{x:10.6,z:-3.4},{x:6.6,z:-7.0},{x:10.6,z:-7.0},
];
const PALLET_X=[-7.2,-5.7,-4.2,-2.7,-1.2,0.3,4.8,6.3,7.8,9.3], TP_PALLET_X=10.8;
const palletZ=()=>stockBack()+1.0;
const custPoint=i=>V(SLOTS[i].x,SLOTS[i].z+1.1);
const stockPoints=i=>[V(SLOTS[i].x,SLOTS[i].z-1.1),custPoint(i)];
const palletPoint=x=>V(x,palletZ()+1.05);
// caixas: balcão em z=2.3, operador do lado da rua (z=3.5), fila para dentro da loja
const REGS=[{x:-5.4},{x:-2.6},{x:7.0},{x:10.6}];
const REG_Z=2.3, regSpot=r=>V(REGS[r].x,3.5), queueSlot=(r,k)=>V(REGS[r].x,1.2-0.85*k);
const regOpen=r=>r===0||has('reg'+r);
const regStaff=r=>has('cash'+r);
// banheiros (depois da ampliação para os fundos)
const BATH={x0:8.5,x1:14,z0:-21.3,z1:-15.0,door:[10.6,12.0]};
const STALLS=[9.35,11.05,12.9].map(x=>({x,toilet:V(x,-20.7),spot:V(x,-19.9),dirt:V(x,-19.3)}));
const BATH_DOOR=V(11.3,-14.3);
// lanchonete
const GRILL={x:-7.45,z:-13.5,w:0.9,d:2.4}, SCOUNTER={x:-5.6,z:-13.5,w:0.9,d:3.0};
const COOK_SPOT=V(-6.5,-13.5), SNACK_SPOTS=[V(-4.6,-12.5),V(-4.6,-13.5),V(-4.6,-14.5)];
const TABLES=[V(-6.4,-17.6),V(-3.4,-17.6),V(-6.4,-20.2),V(-3.4,-20.2)];
const seatOf=t=>V(TABLES[t].x-0.8,TABLES[t].z);
// custo de cada área de compra (quadrados verdes)
const PAD_COST={p1:40,p2:120,p3:350,p4:600,p5:1000,p6:1800,p7:2500,p8:3200,p9:4000,
  cash0:200,stk1:350,reg1:800,cash1:600,stk2:900,east:1500,reg2:1500,cash2:1000,reg3:2500,cash3:1500,stk3:2000,
  back:5000,bath:3000,cleaner:1500,snack:6000,attendant:2000,waiter:2000};
// ---------- Estação do ano (calendário do hemisfério norte) ----------
// endereço com #teste ativa o modo de teste; pode combinar com a estação: #teste-inverno
const HASH=decodeURIComponent(location.hash.slice(1)).toLowerCase().split(/[-,]/);
const TEST_MODE=HASH.includes('teste');
function getSeason(){
  const map={primavera:'spring',verao:'summer','verão':'summer',outono:'autumn',inverno:'winter'};
  for(const h of HASH)if(map[h])return map[h];
  const d=new Date(),v=(d.getMonth()+1)*100+d.getDate();
  if(v>=1221||v<320)return'winter';if(v<621)return'spring';if(v<922)return'summer';return'autumn';
}
const SEASON=getSeason();
const TREE_SUFFIX={spring:'',summer:'',autumn:'Autumn_',winter:'Snow_'}[SEASON];
const TREES=['CommonTree_1','CommonTree_2','CommonTree_3','PineTree_1','PineTree_2'].map(n=>n.replace('_',`_${TREE_SUFFIX}`));
const BUSHES=SEASON==='winter'?['Bush_Snow_1','Bush_Snow_2']:SEASON==='summer'?['BushBerries_1','Bush_2']:['Bush_1','Bush_2'];
const BUILDINGS_A=['2Story_Mat','2Story_Balcony_Mat','3Story_Balcony_Mat','2Story_Sign_Mat','4Story_Mat','2Story_Columns_Mat','3Story_Slim_Mat','1Story_Sign_Mat','2Story_Wide_Mat','4Story_Center_Mat'];
const BUILDINGS_B=['Building3_Small','Building2_Small','Building4','Building3_Big'];
const CARS=['NormalCar1','NormalCar2','SUV','Taxi','SportsCar','SportsCar2','Cop'];
const ENV_FILES=[...TREES,...BUSHES,...(SEASON==='spring'||SEASON==='summer'?['Flowers']:[]),...BUILDINGS_A,...BUILDINGS_B,...CARS,'Streetlight_Single'];
// ---------- Three ----------
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x2b3345);
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,0.1,500);
scene.add(new THREE.HemisphereLight(0xffffff,0x556070,1.7));
const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.position.set(8,16,10); sun.target.position.set(2,0,0);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,far:60});
scene.add(sun,sun.target);
const matCache={};
const mat=c=>matCache[c]||(matCache[c]=new THREE.MeshLambertMaterial({color:c}));
const rgCache={};
function rbox(w,h,d,c,x=0,y=0,z=0,parent=scene,r=0.04){const k=[w,h,d,r].join();const geo=rgCache[k]||(rgCache[k]=new RoundedBoxGeometry(w,h,d,2,Math.min(r,w*0.49,h*0.49,d*0.49)));
  const m=new THREE.Mesh(geo,mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}
function cyl(rt,rb,h,c,x=0,y=0,z=0,parent=scene,seg=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c));m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;}
function box(w,h,d,c,x=0,y=0,z=0,parent=scene){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;}

// chão externo e calçada
const GROUND={spring:0x7fb069,summer:0x6b9a4e,autumn:0xa39a58,winter:0xeef3f6}[SEASON];
const SKY={spring:0xbfe3f5,summer:0xa8d8f5,autumn:0xd9d2c3,winter:0xdde6ee}[SEASON];
scene.background.setHex(SKY);scene.fog=new THREE.Fog(SKY,45,110);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),mat(GROUND));ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;ground.receiveShadow=true;scene.add(ground);
// textura do piso
const ftc=document.createElement('canvas');ftc.width=ftc.height=256;const fx=ftc.getContext('2d');
fx.fillStyle='#e7d4b4';fx.fillRect(0,0,256,256);
function tile(x,y,c,hi){fx.fillStyle=c;fx.beginPath();fx.roundRect(x+5,y+5,118,118,12);fx.fill();
  fx.strokeStyle=hi;fx.lineWidth=3;fx.beginPath();fx.roundRect(x+7,y+7,114,114,10);fx.stroke();}
tile(0,0,'#ecce9f','#f2d9b0');tile(128,128,'#ecce9f','#f2d9b0');tile(128,0,'#f2e8cd','#f8f0dc');tile(0,128,'#f2e8cd','#f8f0dc');
const floorTex=new THREE.CanvasTexture(ftc);floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping;floorTex.colorSpace=THREE.SRGBColorSpace;floorTex.anisotropy=4;

// ---------- Rótulos (DOM) ----------
const labelsEl=document.getElementById('labels');
const labels=new Set();
function addLabel(cls,getPos){const el=document.createElement('div');el.className='lbl '+cls;labelsEl.appendChild(el);const L={el,getPos,html:''};labels.add(L);return L;}
function setLabel(L,html){if(L.html!==html){L.html=html;L.el.innerHTML=html;}}
function removeLabel(L){L.el.remove();labels.delete(L);}
const tmpV=new THREE.Vector3();
function updateLabels(){
  for(const L of labels){
    tmpV.copy(L.getPos()).project(camera);
    if(tmpV.z>1||!L.html){L.el.style.display='none';continue;}
    L.el.style.display='';
    L.el.style.transform=`translate(${(tmpV.x+1)/2*innerWidth}px,${(1-tmpV.y)/2*innerHeight}px) translate(-50%,-100%)`;
  }
}
const floats=[];
function floatText(pos,text,color){const p=pos.clone();p.y=1.8;const L=addLabel('float',()=>p);setLabel(L,text);if(color)L.el.style.color=color;floats.push({L,p,life:1.2});}
const toastEl=document.getElementById('toast');let toastT=0;
function toast(t){toastEl.textContent=t;toastEl.style.opacity=1;toastT=2.2;}

// ---------- Pessoas (modelos Quaternius, CC0) ----------
const loader=new GLTFLoader();loader.setMeshoptDecoder(MeshoptDecoder);
const MODELS={};
const CUSTOMER_KINDS=['casual_m','casual_f','casual2_m','casual3_m','casual3_f','oldclassy_f','suit_m'];
await Promise.all(['worker_m','worker_f','casual2_f',...CUSTOMER_KINDS].map(async n=>{
  const g=await loader.loadAsync(`models/${n}.glb`);
  g.scene.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(g.scene,true);
  MODELS[n]={scene:g.scene,anims:g.animations,scale:1.6/(b.max.y-b.min.y)};
}));
const ENV={};
await Promise.all(ENV_FILES.map(async n=>{const g=await loader.loadAsync(`models/env/${n}.glb`);
  g.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});ENV[n]=g.scene;}));
const people=new Set();
// tints: {nomeDoMaterial: cor}
const SKIN_TONES=[0xf6d5bb,0xeec3a0,0xe0ac85,0xc98d64,0xa86d45,0x8a5533,0x6b3f24,0x4f2e1b];
function makePerson(kind,tints={},moveAnim='Walk'){
  const M=MODELS[kind];
  tints=Object.assign({Skin:SKIN_TONES[Math.floor(Math.random()*SKIN_TONES.length)],Face:0x2b1d16},tints);
  const g=new THREE.Group();
  const m=SkeletonUtils.clone(M.scene);m.scale.setScalar(M.scale);
  m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    const nm=mats.map(mt=>tints[mt.name]!=null?mt.clone():mt);
    nm.forEach(mt=>{if(tints[mt.name]!=null){mt.color=new THREE.Color(tints[mt.name]);}});
    o.material=Array.isArray(o.material)?nm:nm[0];}});
  g.add(m);
  const mixer=new THREE.AnimationMixer(m),actions={};
  for(const c of (M.anims.length?M.anims:MODELS.worker_m.anims))actions[c.name]=mixer.clipAction(c);
  g.userData={mixer,actions,cur:null,moving:false,moveAnim};
  playAnim(g,'Idle');
  scene.add(g);people.add(g);return g;
}
function playAnim(g,name){const a=g.userData;if(a.cur===name||!a.actions[name])return;
  const next=a.actions[name];next.reset().fadeIn(0.15).play();if(a.cur)a.actions[a.cur].fadeOut(0.15);a.cur=name;}
function removePerson(g){scene.remove(g);people.delete(g);g.userData.mixer.stopAllAction();}
function updatePeople(dt){for(const g of people){playAnim(g,g.userData.moving?g.userData.moveAnim:'Idle');g.userData.mixer.update(dt);}}
function makeStack(g,n){const st=new THREE.Group();st.position.set(0,0.95,0.42);g.add(st);const arr=[];
  for(let k=0;k<n;k++){const b=cardBox(0xffffff,0.34,0.2,0.3,st);b.position.y=k*0.205;b.visible=false;b.userData.body=b.children[0];arr.push(b);}return arr;}
function step(o,target,speed,dt){
  const dx=target.x-o.pos.x,dz=target.z-o.pos.z,d=Math.hypot(dx,dz);
  if(d<0.02)return true;
  const s=Math.min(d,speed*dt);o.pos.x+=dx/d*s;o.pos.z+=dz/d*s;
  o.mesh.rotation.y=Math.atan2(dx,dz);o.walkT=(o.walkT||0)+dt*10;
  return s>=d-1e-4;
}
function syncMesh(o){const p=o.mesh.position;o.mesh.userData.moving=Math.hypot(p.x-o.pos.x,p.z-o.pos.z)>0.003;p.set(o.pos.x,0,o.pos.z);}

let storeGroup=null, wallRects=[];
const WALL_H=1.1,WALL_T=0.3,WALL_C=0xe6dccb;
function wallSeg(x0,z0,x1,z1,parent,c=WALL_C,h=WALL_H){ // segmento de parede alinhado aos eixos
  const w=Math.abs(x1-x0)||WALL_T,d=Math.abs(z1-z0)||WALL_T;if(w<0.05||d<0.05)return;
  const m=box(w,h,d,c,(x0+x1)/2,h/2,(z0+z1)/2,parent);
  wallRects.push({minX:Math.min(x0,x1)-(x0===x1?WALL_T/2:0),maxX:Math.max(x0,x1)+(x0===x1?WALL_T/2:0),minZ:Math.min(z0,z1)-(z0===z1?WALL_T/2:0),maxZ:Math.max(z0,z1)+(z0===z1?WALL_T/2:0)});
  return m;
}
// parede horizontal (z fixo) com vãos [a,b]
function wallWithGaps(x0,x1,z,gaps,parent,c,h){const out=[];let x=x0;for(const [a,b] of gaps.slice().sort((p,q)=>p[0]-q[0])){out.push(wallSeg(x,z,a,z,parent,c,h));x=b;}out.push(wallSeg(x,z,x1,z,parent,c,h));return out.filter(Boolean);}
function floorPlane(x0,x1,z0,z1,matl,y,parent){const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,z1-z0),matl);m.rotation.x=-Math.PI/2;m.position.set((x0+x1)/2,y,(z0+z1)/2);m.receiveShadow=true;parent.add(m);return m;}
function tileMat(c1,c2,line,rx,ry){const t=canvasTex(128,128,x=>{x.fillStyle=line;x.fillRect(0,0,128,128);x.fillStyle=c1;x.fillRect(3,3,58,58);x.fillRect(67,67,58,58);x.fillStyle=c2;x.fillRect(67,3,58,58);x.fillRect(3,67,58,58);},rx,ry);return new THREE.MeshLambertMaterial({map:t});}
const _bathTex=new THREE.TextureLoader().load('assets/bath-tiles.png');_bathTex.colorSpace=THREE.SRGBColorSpace;_bathTex.wrapS=_bathTex.wrapT=THREE.RepeatWrapping;
function bathTile(rx,ry){const t=_bathTex.clone();t.needsUpdate=true;t.repeat.set(rx,ry);return t;}
function buildStore(){
  if(storeGroup)scene.remove(storeGroup);
  storeGroup=new THREE.Group();scene.add(storeGroup);wallRects=[];
  const b=bounds(),w=b.maxX-b.minX,d=b.maxZ-b.minZ,sw=stockWallZ();
  const tex=floorTex.clone();tex.needsUpdate=true;tex.repeat.set(w/2,d/2);
  floorPlane(b.minX,b.maxX,b.minZ,b.maxZ,new THREE.MeshLambertMaterial({map:tex}),0.003,storeGroup);
  floorPlane(b.minX,b.maxX,b.minZ,sw,tileMat('#b9bcc2','#b3b6bc','#a3a6ad',w/1.6,3.3/1.6),0.005,storeGroup); // estoque: piso cinza
  if(has('bath'))floorPlane(BATH.x0,BATH.x1,BATH.z0,BATH.z1,tileMat('#cfe7f3','#e6f3fa','#b7d3e2',(BATH.x1-BATH.x0)/1.2,(BATH.z1-BATH.z0)/1.2),0.006,storeGroup);
  if(has('snack'))floorPlane(b.minX,-0.6,-21.3,-9.6,tileMat('#e9776a','#f6efe6','#d8cfc4',7.4/1.4,11.7/1.4),0.006,storeGroup);
  // paredes externas (porta na frente)
  wallSeg(b.minX,b.minZ,b.maxX,b.minZ,storeGroup);
  wallSeg(b.minX,b.minZ,b.minX,b.maxZ,storeGroup);
  wallSeg(b.maxX,b.minZ,b.maxX,b.maxZ,storeGroup);
  wallWithGaps(b.minX,b.maxX,b.maxZ,[[-1.4,1.4]],storeGroup);
  box(w+WALL_T,0.12,WALL_T+0.02,0x2d8f5a,(b.minX+b.maxX)/2,WALL_H,b.minZ,storeGroup);
  // parede do estoque com portas
  wallWithGaps(b.minX,b.maxX,sw,stockDoors().map(x=>[x-0.75,x+0.75]),storeGroup,0xcfc6b5);
  const sl=addStoreLabel(V((b.minX+b.maxX)/2,stockBack()+0.3),'Estoque');
  // banheiros
  if(has('bath')){
    const tiled=[wallSeg(BATH.x0,BATH.z0,BATH.x0,BATH.z1,storeGroup,0xffffff,1.3),...wallWithGaps(BATH.x0,BATH.x1,BATH.z1,[BATH.door],storeGroup,0xffffff,1.3)];
    tiled.forEach(m=>{const g=m.geometry.parameters,len=Math.max(g.width,g.depth);m.material=new THREE.MeshLambertMaterial({map:bathTile(len/0.75,g.height/0.75)});});
    for(const x of[10.2,11.95])wallSeg(x,BATH.z0,x,-19.4,storeGroup,0xf1ede2,1.4);   // divisórias das cabines
    addStoreLabel(V(11.3,-15.0),'🚻 Banheiros');
  }
  if(typeof forestLot!=='undefined')forestLot.forEach(m=>m.visible=!BACK());
  const mt=new THREE.Mesh(new THREE.PlaneGeometry(2.6,1.0),mat(0x2d8f5a));mt.rotation.x=-Math.PI/2;mt.position.set(0,0.008,4.45);storeGroup.add(mt);
}
const storeLabels=[];
function addStoreLabel(p,t){for(const L of storeLabels)if(L.t===t){L.p.copy(p);return L;}

  if(tpPallet)obstacles.push(rect(TP_PALLET_X,palletZ(),1.1,1.1));
  if(stallObjs.length){STALLS.forEach(s=>obstacles.push(rect(s.x,-20.75,0.55,0.75)));obstacles.push(rect(13.55,-17.1,0.6,2.1));}
  if(snackObjs){obstacles.push(rect(GRILL.x,GRILL.z,GRILL.w,GRILL.d),rect(SCOUNTER.x,SCOUNTER.z,SCOUNTER.w+0.1,SCOUNTER.d+0.1));TABLES.forEach(t=>obstacles.push(rect(t.x,t.z,1.0,1.0)));}

const CELL=0.4;let grid=null;
function rebuildNav(){
  rebuildObstacles();
  const b=bounds(),nx=Math.ceil((b.maxX-b.minX)/CELL),nz=Math.ceil((b.maxZ-b.minZ)/CELL),R=0.32;
  const free=new Uint8Array(nx*nz);
  for(let j=0;j<nz;j++)for(let i=0;i<nx;i++){
    const x=b.minX+(i+0.5)*CELL,z=b.minZ+(j+0.5)*CELL;let ok=x>b.minX+0.35&&x<b.maxX-0.35&&z>b.minZ+0.35&&z<b.maxZ-0.2;
    if(ok)for(const o of obstacles){if(x>o.minX-R&&x<o.maxX+R&&z>o.minZ-R&&z<o.maxZ+R){ok=false;break;}}
    free[j*nx+i]=ok?1:0;}
  grid={b,nx,nz,free};
  for(const a of agents())if(a.target)a.path=navPath(a.pos,a.target);
}
const cellOf=p=>[Math.floor((p.x-grid.b.minX)/CELL),Math.floor((p.z-grid.b.minZ)/CELL)];
const cellPos=(i,j)=>V(grid.b.minX+(i+0.5)*CELL,grid.b.minZ+(j+0.5)*CELL);
const isFree=(i,j)=>i>=0&&j>=0&&i<grid.nx&&j<grid.nz&&grid.free[j*grid.nx+i];
function nearestFree(i,j){if(isFree(i,j))return[i,j];for(let r=1;r<12;r++)for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){if(Math.max(Math.abs(di),Math.abs(dj))!==r)continue;if(isFree(i+di,j+dj))return[i+di,j+dj];}return[i,j];}
function lineFree(a,b){const d=a.distanceTo(b),n=Math.ceil(d/(CELL*0.5));for(let k=1;k<n;k++){const p=a.clone().lerp(b,k/n);const [i,j]=cellOf(p);if(!isFree(i,j))return false;}return true;}
function findPath(from,to){
  const [si,sj]=nearestFree(...cellOf(from)),[ti,tj]=nearestFree(...cellOf(to));
  const nx=grid.nx,N=nx*grid.nz,g=new Float32Array(N).fill(1e9),came=new Int32Array(N).fill(-1),closed=new Uint8Array(N);
  const s=sj*nx+si,t=tj*nx+ti;g[s]=0;const open=[[Math.hypot(ti-si,tj-sj),s]];
  const push=(f,n)=>{open.push([f,n]);let k=open.length-1;while(k>0){const p=(k-1)>>1;if(open[p][0]<=open[k][0])break;[open[p],open[k]]=[open[k],open[p]];k=p;}};
  const pop=()=>{const top=open[0],last=open.pop();if(open.length){open[0]=last;let k=0;for(;;){const l=2*k+1,r=l+1;let m=k;if(l<open.length&&open[l][0]<open[m][0])m=l;if(r<open.length&&open[r][0]<open[m][0])m=r;if(m===k)break;[open[m],open[k]]=[open[k],open[m]];k=m;}}return top;};
  let found=false;
  while(open.length){const [,c]=pop();if(closed[c])continue;closed[c]=1;if(c===t){found=true;break;}
    const ci=c%nx,cj=(c-ci)/nx;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){if(!di&&!dj)continue;const ni=ci+di,nj=cj+dj;if(!isFree(ni,nj))continue;
      if(di&&dj&&(!isFree(ci+di,cj)||!isFree(ci,cj+dj)))continue;const n=nj*nx+ni;const ng=g[c]+(di&&dj?1.414:1);
      if(ng<g[n]){g[n]=ng;came[n]=c;push(ng+Math.hypot(ti-ni,tj-nj),n);}}}
  if(!found)return[to.clone()];
  const cells=[];for(let c=t;c!==-1;c=came[c])cells.push(c);cells.reverse();
  const pts=cells.map(c=>cellPos(c%nx,(c-c%nx)/nx));pts[pts.length-1]=to.clone();
  // encurta o caminho onde há linha de visão
  const out=[];let a=from.clone();let k=0;
  while(k<pts.length){let far=k;for(let m=pts.length-1;m>k;m--){if(lineFree(a,pts[m])){far=m;break;}}out.push(pts[far]);a=pts[far];k=far+1;}
  return out;
}
const DOOR_IN=V(0,4.3);
function navPath(from,to){
  const out=[];let f=from;
  if(from.z>4.9){if(Math.abs(from.x)>0.6)out.push(V(0,6.6));out.push(DOOR_IN.clone());f=DOOR_IN;}
  if(to.z>4.9){out.push(...findPath(f,DOOR_IN),V(0,6.6),to.clone());return out;}
  out.push(...findPath(f,to));return out;
}
function goTo(a,target){a.target=target.clone();a.path=navPath(a.pos,a.target);}
function walk(a,speed,dt){if(!a.path||!a.path.length)return true;if(step(a,a.path[0],speed,dt))a.path.shift();return !a.path.length;}
function collide(p,r){
  for(const o of obstacles){
    const cx=Math.max(o.minX,Math.min(p.x,o.maxX)),cz=Math.max(o.minZ,Math.min(p.z,o.maxZ));
    const dx=p.x-cx,dz=p.z-cz,d=Math.hypot(dx,dz);
    if(d<r){if(d>1e-4){p.x=cx+dx/d*r;p.z=cz+dz/d*r;}else{p.z=o.maxZ+r;}}
  }
  const b=bounds();p.x=Math.max(b.minX+0.15+r,Math.min(b.maxX-0.15-r,p.x));p.z=Math.max(b.minZ+0.15+r,Math.min(b.maxZ-0.25-r,p.z));
}

const reserved=new Map(); // alvo -> funcionário
function reserve(key,a){if(reserved.has(key)&&reserved.get(key)!==a)return false;reserved.set(key,a);return true;}

function updateStaff(dt){

    if(a.role==='cashier'){syncMesh(a);continue;}
    if(a.path&&a.path.length){if(a.tool)a.tool.visible=false;walk(a,2.8,dt);syncMesh(a);if(a.stack)showStack(a.stack,a.carry,a.type);continue;}

}
function stockerAI(a){
  if(a.state==='idle'&&a.t>0.4){a.t=0;
    let best=-1,br=0.7;
    for(const i of unlockedList()){const r=S.stock[i]/cap(i);if(r<br&&(a.carry===0||a.type===i)&&(!reserved.has('shelf'+i)||reserved.get('shelf'+i)===a)){br=r;best=i;}}
    if(best>=0){reserve('shelf'+best,a);a.type=best;
      if(a.carry>0){goTo(a,stockPoints(best)[0]);a.state='drop';}else{goTo(a,palletPoint(PALLET_X[best]));a.state='pick';}}
    else{release(a);const home=V(0.5+staff.indexOf(a)%3*1.2,palletZ()+2.2);if(a.pos.distanceTo(home)>0.4)goTo(a,home);}
  }else if(a.state==='pick'&&a.t>0.2){a.t=0;const i=a.type,need=cap(i)-S.stock[i];
    if(a.carry<6&&a.carry<need&&S.money>=cost(i)){a.carry++;S.money-=cost(i);}

}

}

  for(const p of PADS){
    if(isBought(p)){if(p.mesh){scene.remove(p.mesh);removeLabel(p.L);p.mesh=null;}continue;}
    if(!p.cond())continue;
    // pads que dividem o lugar: só um por vez
    if(PADS.some(q=>q!==p&&q.mesh&&q.x===p.x&&q.z===p.z))continue;
    if(!p.mesh){
      p.mesh=new THREE.Group();
      const pl=new THREE.Mesh(new THREE.PlaneGeometry(p.w,p.d),padMat);pl.rotation.x=-Math.PI/2;p.mesh.add(pl);
      const ed=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(p.w,p.d)),new THREE.LineBasicMaterial({color:0x3ddc84}));ed.rotation.x=-Math.PI/2;p.mesh.add(ed);
      p.mesh.position.set(p.x,0.02,p.z);scene.add(p.mesh);
      p.L=addLabel('box pad',()=>V(p.x,p.z).setY(0.3));

    const on=Math.abs(player.pos.x-p.x)<p.w/2&&Math.abs(player.pos.z-p.z)<p.d/2;

}

function nearBox(p,cx,cz,hw,hd,r){const dx=Math.max(Math.abs(p.x-cx)-hw,0),dz=Math.max(Math.abs(p.z-cz)-hd,0);return Math.hypot(dx,dz)<r;}
const nearPalletX=(p,x)=>nearBox(p,x,palletZ(),0.55,0.55,0.75);
const nearShelf=(p,i)=>nearBox(p,SLOTS[i].x,SLOTS[i].z,1.3,0.4,0.75);
function dropOne(){player.carry--;if(!player.carry)player.type=-1;}
function playerActions(dt){
  const p=player.pos;
  if(player.noMoneyT)player.noMoneyT=Math.max(0,player.noMoneyT-dt);
  // limpeza: ficar parado perto de sujeira
  let cleaning=null;
  STALLS.forEach((s,k)=>{if(stallObjs[k]&&S.dirty[k]&&p.distanceTo(s.dirt)<1.0)cleaning={kind:'stall',k,pos:s.dirt};});
  if(snackObjs)TABLES.forEach((t,k)=>{if(S.tables[k]&&nearBox(p,t.x,t.z,0.5,0.5,0.8))cleaning={kind:'table',k,pos:t};});
  if(!player.mop){player.mop=attachMop(player.mesh);player.cloth=makeCloth();}
  player.mop.visible=false;player.cloth.visible=false;
  if(cleaning){player.cleanT+=dt;dirtProg[cleaning.kind+cleaning.k]=player.cleanT/1.2;
    cleanAnim(player,cleaning.kind==='stall'?player.mop:player.cloth,cleaning.kind,cleaning.pos,player.cleanT/1.2,dt);if(!player.cleanL)player.cleanL=addLabel('box',()=>player.pos.clone().setY(2.1));
    setLabel(player.cleanL,`🧹 Limpando<div class="bar"><i style="width:${Math.min(100,player.cleanT/1.2*100)}%"></i></div>`);
    if(player.cleanT>=1.2){if(cleaning.kind==='stall'){S.dirty[cleaning.k]=false;updateStall(cleaning.k);}else{S.tables[cleaning.k]=false;updateSnack();}player.cleanT=0;floatText(p,'Limpo! ✨','#9be7ff');}}
  else{player.cleanT=0;if(player.cleanL){removeLabel(player.cleanL);player.cleanL=null;}}
  player.actT+=dt;if(player.actT<0.12)return;
  let acted=false;const t=player.type;
  if(player.carry>0&&t>=0&&t<TP&&nearShelf(p,t)&&S.stock[t]<cap(t)){S.stock[t]++;dropOne();updateShelf(t);acted=true;}
  else if(player.carry>0&&t===TP){const k=STALLS.findIndex((s,j)=>stallObjs[j]&&S.tp[j]<TP_CAP&&p.distanceTo(s.spot)<1.1);if(k>=0){S.tp[k]++;dropOne();updateStall(k);acted=true;}}
  else if(player.carry>0&&t===SNACK&&nearBox(p,SCOUNTER.x,SCOUNTER.z,SCOUNTER.w/2,SCOUNTER.d/2,0.8)&&S.counter<COUNTER_CAP){S.counter++;dropOne();updateSnack();acted=true;}
  if(!acted){
    // pegar no pallet / chapa
    for(const i of unlockedList()){
      if(!nearPalletX(p,PALLET_X[i]))continue;
      if(player.carry>0&&t!==i){if(t<TP)S.money+=cost(t);else if(t===TP)S.money+=TP_COST;dropOne();acted=true;}
      else if(player.carry<carryCap()&&S.money>=cost(i)){player.carry++;player.type=i;S.money-=cost(i);acted=true;}
      else if(S.money<cost(i)&&player.carry===0&&!player.noMoneyT){floatText(p,'Sem dinheiro','#ff6b6b');player.noMoneyT=2;}
      break;
    }
    if(!acted&&tpPallet&&nearPalletX(p,TP_PALLET_X)){
      if(player.carry>0&&t!==TP){if(t<TP)S.money+=cost(t);dropOne();acted=true;}
      else if(player.carry<carryCap()&&S.money>=TP_COST){player.carry++;player.type=TP;S.money-=TP_COST;acted=true;}
    }
    if(!acted&&snackObjs&&nearBox(p,GRILL.x,GRILL.z,GRILL.w/2,GRILL.d/2,0.8)&&S.grill>0&&(player.carry===0||t===SNACK)&&player.carry<carryCap()){
      S.grill--;player.carry++;player.type=SNACK;updateSnack();acted=true;}
  }
  if(acted)player.actT=0;
}

const customers=[],queues=[[],[],[],[]];
const CUST_COLORS=[0xe74c3c,0x9b59b6,0x34495e,0x16a085,0xd35400,0x8e44ad,0x2c3e50,0xc0392b,0x27ae60,0xf39c12];
const agents=()=>[...customers,...staff];
const outside=()=>V(Math.random()<0.5?-14:14,6.4+Math.random()*0.8);
function spawnCustomer(){
  const unl=unlockedList().filter(i=>S.stock[i]>0||Math.random()<0.5);
  const snackOnly=snackObjs&&Math.random()<0.15;
  const n=snackOnly?0:1+Math.floor(Math.random()*Math.min(4,Math.max(1,unl.length)));
  const wants=unl.sort(()=>Math.random()-0.5).slice(0,n);
  if(!snackOnly&&!wants.length)return;
  const col=CUST_COLORS[Math.floor(Math.random()*CUST_COLORS.length)],kind=CUSTOMER_KINDS[Math.floor(Math.random()*CUSTOMER_KINDS.length)];
  const c={mesh:makePerson(kind,Math.random()<0.6?{Shirt:col}:{}),pos:outside(),path:[],target:null,items:[],state:'',t:0,
    tasks:[...wants.map(i=>['shop',i]),...(stallObjs.length&&Math.random()<0.3?[['bath']]:[]),['pay'],...(snackObjs&&(snackOnly||Math.random()<0.3)?[['snack']]:[]),['exit']]};
  c.mesh.position.copy(c.pos);
  c.bubble=addLabel('bubble',()=>c.pos.clone().setY(1.75));
  nextTask(c);customers.push(c);
}
function nextTask(c){
  const tk=c.tasks.shift();c.task=tk;c.t=0;
  if(!tk){c.state='gone';return;}
  const [kind,i]=tk;
  if(kind==='shop'){const pt=custPoint(i);pt.x+=(Math.random()-0.5)*1.6;goTo(c,pt);c.state='toShelf';}
  else if(kind==='bath'){goTo(c,BATH_DOOR);c.state='toBath';}
  else if(kind==='pay'){if(!c.items.length){nextTask(c);return;}
    let best=0,bl=1e9;REGS.forEach((r,k)=>{if(!regOpen(k))return;const l=queues[k].length+(regStaff(k)?0:0.5)+Math.abs(c.pos.x-r.x)*0.05;if(l<bl){bl=l;best=k;}});
    c.reg=best;queues[best].push(c);goTo(c,queueSlot(best,Math.min(queues[best].length-1,4)));c.state='queue';}
  else if(kind==='snack'){c.state='toSnack';const k=SNACK_SPOTS.findIndex((s,j)=>reserve('sspot'+j,c));
    if(k<0){goTo(c,V(-3.4,-12.0+Math.random()*-1.5));c.spot=-1;}else{c.spot=k;goTo(c,SNACK_SPOTS[k]);}}
  else if(kind==='exit'){goTo(c,outside());c.state='exit';}
}
function angry(c,dropItems){c.angry=true;floatText(c.pos,'😠','#fff');
  if(dropItems&&c.items.length){c.items=[];c.tasks=c.tasks.filter(t=>t[0]!=='pay');}}
function updateCustomers(dt){
  for(const c of customers){
    const arrived=walk(c,2.4,dt);
    let bubble='';
    switch(c.state){
      case 'toShelf':if(arrived){c.state='shop';c.t=0;}break;
      case 'shop':{const i=c.task[1];c.t+=dt;c.mesh.rotation.y=Math.PI;
        if(S.stock[i]>0){bubble='🛒';if(c.t>0.4){S.stock[i]--;c.items.push(price(i));updateShelf(i);nextTask(c);}}
        else{bubble=c.t>3?'😠':'❗';if(c.t>6){angry(c);nextTask(c);}}break;}
      case 'toBath':if(arrived){c.state='bathWait';c.t=0;}break;
      case 'bathWait':{c.t+=dt;const k=STALLS.findIndex((s,j)=>stallUsable(j));
        if(k>=0){stallObjs[k].busy=c;c.stall=k;goTo(c,STALLS[k].spot);c.state='toStall';}
        else{bubble=c.t>2?'😣':'🚻';if(c.t>7){angry(c,true);nextTask(c);}}break;}
      case 'toStall':if(arrived){c.state='using';c.t=0;}break;
      case 'using':{c.t+=dt;c.mesh.rotation.y=Math.PI;bubble='🚽';if(c.t>3){const k=c.stall;S.tp[k]=Math.max(0,S.tp[k]-1);if(Math.random()<0.35)S.dirty[k]=true;
        stallObjs[k].busy=null;updateStall(k);goTo(c,BATH_DOOR);c.state='leaveBath';}break;}
      case 'leaveBath':if(arrived)nextTask(c);break;
      case 'queue':{const q=queues[c.reg],k=q.indexOf(c);const slot=queueSlot(c.reg,Math.min(k,4));
        if(c.path.length===0&&c.pos.distanceTo(slot)>0.1&&k<5)c.path=[slot];
        bubble=c.items.length?'🛒'+c.items.length:'';
        if(k===0&&c.pos.distanceTo(slot)<0.12){c.mesh.rotation.y=Math.PI;
          const atReg=player.pos.distanceTo(regSpot(c.reg))<1.0;const time=0.4+0.25*c.items.length;
          const rate=atReg?1/time:(regStaff(c.reg)?0.65/time:0);c.t+=dt*rate;
          bubble=rate?`💳 ${Math.round(Math.min(c.t,1)*100)}%`:'⏳';
          if(c.t>=1){const total=c.items.reduce((a,b)=>a+b,0)*boost();S.money+=total;floatText(V(REGS[c.reg].x,REG_Z),'+$'+total);
            q.shift();c.items=[];nextTask(c);}}
        break;}
      case 'toSnack':if(arrived){if(c.spot<0){const k=SNACK_SPOTS.findIndex((s,j)=>reserve('sspot'+j,c));if(k>=0){c.spot=k;goTo(c,SNACK_SPOTS[k]);}else{c.t+=0.5;if(c.t>8){angry(c);nextTask(c);}}}else{c.state='buySnack';c.t=0;}}break;
      case 'buySnack':{c.t+=dt;c.mesh.rotation.y=-Math.PI/2;
        if(S.counter>0){bubble='🍔';if(c.t>0.6){S.counter--;updateSnack();const v=SNACK_PRICE*boost();S.money+=v;floatText(c.pos,'+$'+v);release(c);
          const t=TABLES.findIndex((x,j)=>!S.tables[j]&&reserve('tbl'+j,c));
          if(t>=0){c.table=t;goTo(c,seatOf(t));c.state='toTable';}else nextTask(c);}}
        else{bubble=c.t>3?'😠':'❗';if(c.t>8){release(c);angry(c);nextTask(c);}}break;}
      case 'toTable':if(arrived){c.state='eat';c.t=0;}break;
      case 'eat':c.t+=dt;c.mesh.rotation.y=Math.PI/2;bubble='😋';if(c.t>6){S.tables[c.table]=true;updateSnack();release(c);nextTask(c);}break;
      case 'exit':bubble=c.angry?'😠':'😊';if(arrived)c.state='gone';break;
    }
    if(c.state!=='queue'&&c.items.length&&!bubble)bubble='🛒'+c.items.length;
    setLabel(c.bubble,bubble);
  }
  for(let k=customers.length-1;k>=0;k--){
    const c=customers[k];
    if(c.state==='gone'){release(c);for(const q of queues){const i=q.indexOf(c);if(i>=0)q.splice(i,1);}if(c.stall!=null&&stallObjs[c.stall]&&stallObjs[c.stall].busy===c)stallObjs[c.stall].busy=null;
      removePerson(c.mesh);removeLabel(c.bubble);customers.splice(k,1);continue;}
    syncMesh(c);
  }
}
let spawnT=1;
function updateSpawn(dt){
  const n=unlockedList().length+REGS.filter((r,k)=>regOpen(k)).length+(snackObjs?2:0);
  spawnT-=dt;
  if(spawnT<=0){spawnT=Math.max(1.0,5-0.4*n)*(0.7+Math.random()*0.6);if(customers.length<Math.min(26,3+2*n))spawnCustomer();}
}

function updatePlayer(dt){

const camTarget=new THREE.Vector3();
let zoom=1;const ZMIN=0.55,ZMAX=5;
function setZoom(z){zoom=Math.max(ZMIN,Math.min(ZMAX,z));scene.fog.near=45*Math.max(1,zoom);scene.fog.far=110*Math.max(1,zoom);
  const sc=sun.shadow.camera,e=Math.min(60,20*Math.max(1,zoom));sc.left=-e;sc.right=e;sc.top=e;sc.bottom=-e;sc.far=60+e;sc.updateProjectionMatrix();}
function updateCamera(dt,snap){
  const vf=THREE.MathUtils.degToRad(camera.fov)/2,hf=Math.atan(Math.tan(vf)*camera.aspect);
  const d=Math.max(4.6/Math.tan(hf),5/Math.tan(vf))*zoom;
  const dy=d*0.8,dz=d*0.6;
  if(customizing){const port=innerWidth<innerHeight;camTarget.set(player.pos.x,port?2.6:1.9,player.pos.z+(port?5.4:3.4));
    camera.position.lerp(camTarget,snap?1:Math.min(1,dt*6));camera.lookAt(player.pos.x,port?-0.15:0.7,player.pos.z);return;}
  camTarget.set(player.pos.x,dy,player.pos.z+dz);
  if(snap)camera.position.copy(camTarget);else camera.position.lerp(camTarget,Math.min(1,dt*5));
  camera.lookAt(camera.position.x,0,camera.position.z-dz);
}

// ---------- Cidade: calçada, rua, prédios, árvores, carros e pedestres ----------
const SW_Z0=5.15,SW_Z1=8.4,RD_Z0=8.4,RD_Z1=14.6,FS_Z1=17.4;
function canvasTex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'));
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;t.repeat.set(rx,ry);t.anisotropy=4;return t;}
function flat(w,d,matl,x,z,y=0.005){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),matl);m.rotation.x=-Math.PI/2;m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);return m;}
{
  const snow=SEASON==='winter';
  const swTex=canvasTex(128,128,x=>{x.fillStyle=snow?'#e4e8ec':'#cfcac0';x.fillRect(0,0,128,128);x.strokeStyle=snow?'#d3d8de':'#b9b3a7';x.lineWidth=3;x.strokeRect(0,0,128,128);},140/1.6,(SW_Z1-SW_Z0)/1.6);
  flat(140,SW_Z1-SW_Z0,new THREE.MeshLambertMaterial({map:swTex}),5,(SW_Z0+SW_Z1)/2,0.004);
  const fsTex=swTex.clone();fsTex.needsUpdate=true;fsTex.repeat.set(140/1.6,(FS_Z1-RD_Z1)/1.6);
  flat(140,FS_Z1-RD_Z1,new THREE.MeshLambertMaterial({map:fsTex}),5,(RD_Z1+FS_Z1)/2,0.004);
  const rdTex=canvasTex(256,256,x=>{x.fillStyle='#4f5359';x.fillRect(0,0,256,256);x.fillStyle='#f2d24b';x.fillRect(0,122,150,12);},140/6,1);
  flat(140,RD_Z1-RD_Z0,new THREE.MeshLambertMaterial({map:rdTex}),5,(RD_Z0+RD_Z1)/2,0.002);
  for(const z of[RD_Z0,RD_Z1])box(140,0.14,0.22,snow?0xdfe4e8:0xa9a49a,5,0.07,z);
  for(let k=0;k<7;k++)flat(0.55,RD_Z1-RD_Z0-0.6,mat(0xf4f4f4),-1.9+k*0.7,(RD_Z0+RD_Z1)/2,0.006); // faixa de pedestres
  if(snow){for(const z of[RD_Z0+0.35,RD_Z1-0.35])flat(140,0.5,mat(0xe9eef2),5,z,0.004);}
}
function envClone(n,scale=1,tints,shadow=true){const o=ENV[n].clone(true);
  o.traverse(m=>{if(!m.isMesh)return;m.castShadow=shadow;if(tints&&tints[m.material.name]!=null){m.material=m.material.clone();m.material.color.setHex(tints[m.material.name]);}});
  o.scale.setScalar(scale);scene.add(o);return o;}
const FACADE=[0xe9d7b6,0xd98c7a,0x9cc3d5,0xe8c26b,0xb7c99a,0xf0e6dc,0xc9a3c9,0xa8c7b8];
let bIdx=0;
// coloca um prédio com a frente virada para a rua (ou para trás) a partir de uma borda
function placeBuilding(edgeX,dir,frontZ,faceSouth=true,parent=scene,shadow=true){
  const useA=bIdx%3!==2;const name=useA?BUILDINGS_A[bIdx%BUILDINGS_A.length]:BUILDINGS_B[bIdx%BUILDINGS_B.length];
  const tints=useA?{Main:FACADE[bIdx%FACADE.length],Dark:0x5d6168}:null;bIdx++;
  const o=envClone(name,useA?2.6:1.9,tints,shadow);if(!faceSouth)o.rotation.y=Math.PI;parent.add(o);
  o.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(o);
  o.position.x+=dir>0?edgeX-b.min.x:edgeX-b.max.x;
  o.position.z+=faceSouth?frontZ-b.max.z:frontZ-b.min.z;
  return dir>0?edgeX+(b.max.x-b.min.x):edgeX-(b.max.x-b.min.x);
}
// fileira a oeste do mercado
{let x=-8.7;for(let k=0;k<5;k++)x=placeBuilding(x,-1,5.0)-0.5;}
// fileira a leste: anda para o lado quando a loja é ampliada
const eastRow=new THREE.Group();scene.add(eastRow);
{let x=4.6;for(let k=0;k<6;k++)x=placeBuilding(x,1,5.0,true,eastRow)+0.5;}
const eastX=()=>bounds().maxX-4;eastRow.position.x=eastX();
// do outro lado da rua (frente virada para o mercado) e ao fundo
{let x=-42;while(x<55)x=placeBuilding(x,1,FS_Z1+0.3,false,scene,false)+0.6;}
// bosque atrás do mercado e dos prédios (instanciado em blocos para ficar leve)
const forestLot=[];
{
  let seed=7;const rnd=()=>((seed=(seed*16807)%2147483647)/2147483647);
  const FT=[TREES[0],TREES[2],TREES[3]];
  const pts=[];
  for(let x=-50;x<=60;x+=4.6)for(let z=-6;z>=-42;z-=4.6){
    const jx=x+(rnd()-0.5)*2.8,jz=z+(rnd()-0.5)*2.8;
    if(jx>-10.5&&jx<16.5&&jz>-27.5)continue;     // terreno do mercado (até a ampliação dos fundos)
    pts.push([jx,jz,rnd(),false]);}
  // algumas árvores no terreno atrás da loja enquanto ela não cresce para os fundos
  for(let x=-50;x<=60;x+=4.6)for(let z=28;z<=44;z+=4.6)pts.push([x+(rnd()-0.5)*2.8,z+(rnd()-0.5)*2.8,rnd(),false]); // atrás dos prédios do outro lado da rua
  for(let x=-7;x<=13;x+=4.4)pts.push([x+(rnd()-0.5)*1.5,-20.5+(rnd()-0.5)*2,rnd(),true]);
  const chunks=new Map();
  for(const p of pts){const key=(p[3]?'lot':Math.floor(p[0]/24)+','+Math.floor(p[1]/24))+'|'+Math.floor(p[2]*FT.length)%FT.length;
    if(!chunks.has(key))chunks.set(key,[]);chunks.get(key).push(p);}
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),UP=new THREE.Vector3(0,1,0);
  for(const [key,arr] of chunks){const ti=+key.split('|')[1],lot=key.startsWith('lot');const src=ENV[FT[ti]];src.updateMatrixWorld(true);
    src.traverse(m=>{if(!m.isMesh)return;
      const im=new THREE.InstancedMesh(m.geometry,m.material,arr.length);im.castShadow=lot;im.receiveShadow=false;
      arr.forEach((p,k)=>{const sc=1.2+p[2]*0.5;M.compose(V(p[0],p[1]),Q.setFromAxisAngle(UP,p[2]*6.28),new THREE.Vector3(sc,sc,sc));M.multiply(m.matrixWorld);im.setMatrixAt(k,M);});
      im.computeBoundingSphere();scene.add(im);if(lot)forestLot.push(im);});}
}
// árvores, arbustos, postes e flores
const NATURE=[];
function tree(x,z,k){const o=envClone(TREES[k%TREES.length],1.15+((k*37)%10)/40);o.position.set(x,0,z);o.rotation.y=k*1.7;
  flat(1.1,1.1,mat(SEASON==='winter'?0xd7dde2:0x6b5a45),x,z,0.008);NATURE.push(o);}
{let k=0;for(let x=-42;x<56;x+=6.5){if(x<-10||x>15)tree(x,SW_Z1-0.75,k);tree(x+3.2,RD_Z1+0.9,k+3);k++;}}
for(let x=-40;x<56;x+=13){const l=envClone('Streetlight_Single',3.2);l.position.set(x+1.6,0,SW_Z1-0.35);l.rotation.y=Math.PI;}
[-7.2,-5.2,-3.4,2.6].forEach((x,k)=>{const b=envClone(BUSHES[k%BUSHES.length],0.55);b.position.set(x,0,SW_Z0+0.55);b.rotation.y=k;});
if(ENV.Flowers)[-6.2,-4.3,3.4].forEach((x,k)=>{const f=envClone('Flowers',0.9,null,false);f.position.set(x,0,SW_Z0+0.45);f.rotation.y=k*2;});
// carros
const cars=[];
for(let k=0;k<7;k++){const dir=k%2?-1:1;const o=envClone(CARS[k%CARS.length],1.05);
  const c={o,dir,z:dir>0?RD_Z0+1.55:RD_Z1-1.55,x:-55+k*17+Math.random()*6,speed:6+Math.random()*3};
  o.rotation.y=dir>0?Math.PI/2:-Math.PI/2;o.position.set(c.x,0,c.z);cars.push(c);}
function updateCars(dt){for(const c of cars){c.x+=c.dir*c.speed*dt;if(c.x>62)c.x=-62;if(c.x<-62)c.x=62;c.o.position.x=c.x;}}
// pedestres que só passam pela calçada
const walkers=[];
for(let k=0;k<7;k++){const dir=k%2?-1:1;const kind=CUSTOMER_KINDS[k%CUSTOMER_KINDS.length];
  const w={mesh:makePerson(kind,Math.random()<0.6?{Shirt:CUST_COLORS[k%CUST_COLORS.length]}:{}),pos:V(-40+k*12,6.2+((k*3)%4)*0.45),dir,speed:1.3+Math.random()*0.7};
  w.mesh.rotation.y=dir>0?Math.PI/2:-Math.PI/2;walkers.push(w);}
function updateWalkers(dt){for(const w of walkers){w.pos.x+=w.dir*w.speed*dt;if(w.pos.x>48)w.pos.x=-45;if(w.pos.x<-45)w.pos.x=48;syncMesh(w);}}
// neve no inverno, folhas no outono
let fall=null;
if(SEASON==='winter'||SEASON==='autumn'){
  const N=SEASON==='winter'?1400:220,pos=new Float32Array(N*3);for(let i=0;i<N*3;i++)pos[i]=(Math.random()-0.5)*40;
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  fall=new THREE.Points(geo,new THREE.PointsMaterial({color:SEASON==='winter'?0xffffff:0xd9822b,size:SEASON==='winter'?0.09:0.16,transparent:true,opacity:0.9,depthWrite:false}));scene.add(fall);
}
function updateFall(dt){if(!fall)return;const a=fall.geometry.attributes.position,arr=a.array,sp=SEASON==='winter'?1.6:0.9,t=performance.now()/1000;
  for(let i=0;i<arr.length;i+=3){arr[i+1]-=sp*dt;arr[i]+=Math.sin(t+i)*dt*0.4;if(arr[i+1]<0){arr[i+1]=12+Math.random()*4;}}
  a.needsUpdate=true;fall.position.set(player.pos.x,0,player.pos.z);}
// ---------- Inicialização ----------
buildStore();
REGS.forEach((r,k)=>{if(regOpen(k))buildReg(k);});
unlockedList().forEach(i=>{buildShelf(i);buildPallet(i);});
if(has('bath'))buildBathroom();
if(has('snack'))buildSnackBar();
REGS.forEach((r,k)=>{if(regStaff(k))hire('cashier',{reg:k});});
['stk1','stk2','stk3'].forEach(id=>{if(has(id))hire('stocker');});
if(has('cleaner'))hire('cleaner');if(has('attendant'))hire('attendant');if(has('waiter'))hire('waiter');
rebuildNav();
updateCamera(0,true);

const moneyEl=document.getElementById('money'),boostEl=document.getElementById('boost'),lvlEl=document.getElementById('lvl');
let saveT=0,last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  updatePlayer(dt);updatePads(dt);updateSpawn(dt);updateCustomers(dt);updateStaff(dt);updateGrill(dt);updateCleanFX(dt);updateSteam(dt);
  updateCars(dt);updateWalkers(dt);updateFall(dt);updatePeople(dt);
  eastRow.position.x+=(eastX()-eastRow.position.x)*Math.min(1,dt*1.5);
  sun.position.set(player.pos.x+8,16,player.pos.z+10);sun.target.position.set(player.pos.x+2,0,player.pos.z);
  for(let k=floats.length-1;k>=0;k--){const f=floats[k];f.life-=dt;f.p.y+=dt*1.3;f.L.el.style.opacity=Math.min(1,f.life*2);if(f.life<=0){removeLabel(f.L);floats.splice(k,1);}}
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.style.opacity=0;}
  updateCamera(dt);renderer.render(scene,camera);updateLabels();
  moneyEl.textContent='$'+Math.floor(S.money).toLocaleString('pt-BR');
  const bl=boostUntil-performance.now();
  boostEl.textContent=bl>0?` ×2 ${Math.ceil(bl/1000)}s`:'';
  btnAd.disabled=bl>0;
  lvlEl.textContent='Loja nível '+(1+PADS.filter(isBought).length);
  updateHint();
  saveT+=dt;if(saveT>3){saveT=0;save();}
  requestAnimationFrame(loop);
}
// ---------- Visual do personagem ----------
const lookEl=document.getElementById('look');
function hex(c){return '#'+c.toString(16).padStart(6,'0');}
function renderLook(){
  const L=look();
  const sw=(arr,key)=>arr.map((c,i)=>`<button data-k="${key}" data-v="${i}" class="${L[key]===i?'on':''}" style="background:${hex(c)}" aria-label="cor ${i+1}"></button>`).join('');
  lookEl.innerHTML=`<h3>Seu personagem</h3>
  <div class="lab">Tom de pele</div><div class="sw">${sw(SKIN_TONES,'skin')}</div>
  <div class="lab">Na cabeça</div><div class="opt">${HEADS.map(([k,n])=>`<button data-k="head" data-v="${k}" class="${L.head===k?'on':''}">${n}</button>`).join('')}</div>
  <div class="lab">${HEADS.find(h=>h[0]===L.head)[2]}</div><div class="sw">${sw(SHIRT_COLORS,'headColor')}</div>
  <div class="lab">Cor da blusa</div><div class="sw">${sw(SHIRT_COLORS,'shirt')}</div>
  <button class="done" id="lookDone">Pronto</button>`;
}
lookEl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='lookDone'){closeLook();return;}
  const k=b.dataset.k;if(!k)return;const L=look();L[k]=k==='head'?b.dataset.v:+b.dataset.v;S.look=L;applyLook();renderLook();});
function openLook(){customizing=true;joy.active=false;joy.x=joy.y=0;S.look=look();renderLook();lookEl.classList.remove('hidden');document.getElementById('hud').style.visibility='hidden';hintEl.style.visibility='hidden';labelsEl.style.visibility='hidden';document.getElementById('zoom').style.visibility='hidden';}
function closeLook(){customizing=false;lookEl.classList.add('hidden');document.getElementById('hud').style.visibility='';hintEl.style.visibility='';labelsEl.style.visibility='';document.getElementById('zoom').style.visibility='';save();}
document.getElementById('btnLook').onclick=openLook;
// ---------- Modo de teste ----------
function unlockAll(){
  for(let round=0;round<40;round++){let any=false;
    for(const p of PADS){if(isBought(p)||!p.cond())continue;S.padPaid[p.id]=p.cost;if(p.mesh){scene.remove(p.mesh);removeLabel(p.L);p.mesh=null;}p.buy();any=true;}
    if(!any)break;}
  save();toast('Tudo liberado!');
}
if(TEST_MODE){
  const box=document.createElement('div');box.id='testbox';
  box.innerHTML='<b>MODO TESTE</b><button id="tMoney">+$50.000</button><button id="tAll">Liberar tudo</button>';
  document.body.appendChild(box);
  document.getElementById('tMoney').onclick=()=>{S.money+=50000;save();toast('+$50.000');};
  document.getElementById('tAll').onclick=unlockAll;
}
const firstRun=!S.look;
if(firstRun)openLook();
updateCamera(0,true);
document.getElementById('loading').remove();
requestAnimationFrame(loop);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.__game={S,player,customers,staff,queues,get grid(){return grid},relayout,rebuildNav,PADS,updateStall,updateSnack};
</script>
